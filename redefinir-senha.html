<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La’Bella | Redefinir senha</title>
<style>:root{color-scheme:dark;font-family:Arial,sans-serif;background:#160f10;color:#f4e4d2}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:24px;display:grid;place-items:center;background:radial-gradient(ellipse at top,#4b3025,#130e0f 65%)}main{width:min(100%,460px);padding:31px;border:1px solid #8c664d;background:linear-gradient(130deg,#2a1d19,#1b1414);border-radius:23px}a{color:#dec097}h1{font:normal 34px Georgia,serif}p{font-size:13px;line-height:1.65;color:#d5bba6}label{display:block;font-weight:700;margin:20px 0 7px;font-size:13px}input{width:100%;min-height:50px;border:1px solid #997459;background:#140f0f;padding:13px;border-radius:11px;color:white;font:inherit}button{width:100%;min-height:53px;border-radius:12px;margin:20px 0 0;border:0;background:linear-gradient(95deg,#f3dab4,#d6a77c);color:#23160e;font-weight:800;font:inherit;cursor:pointer}button:disabled{opacity:.5}#status{padding:12px;border:1px solid #856149;border-radius:9px;white-space:pre-wrap}</style>
</head><body><main><a href="./acesso.html">← Voltar</a><h1>Escolha sua nova senha</h1><p>Acesse este formulário pelo link recebido no e-mail de recuperação. Sua senha será atualizada pelo Supabase Auth.</p>
<form id="reset"><label for="new-password">Nova senha</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" required placeholder="Mínimo de 8 caracteres"><label for="confirm">Confirmar senha</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Repita a nova senha"><button type="submit" id="save">Atualizar senha</button></form>
<p id="status" role="status" aria-live="polite">Verificando seu link…</p></main>
<script src="./auth-config.js"></script><script src="./auth-core.js"></script><script>
(async()=>{
 const el=id=>document.getElementById(id);
 try{
  const db=await window.LaBellaAuth.getClient();
  const {data:{session}}=await db.auth.getSession();
  el('status').textContent=session?'Link reconhecido. Crie sua nova senha.':'Abra o link de recuperação enviado ao seu e-mail. Se expirou, solicite outro na tela de entrada.';
  el('reset').onsubmit=async e=>{
   e.preventDefault();
   const one=el('new-password').value,two=el('confirm').value;
   if(one!==two){el('status').textContent='As senhas estão diferentes.';return}
   if(one.length<8){el('status').textContent='Use pelo menos oito caracteres.';return}
   el('save').disabled=true;
   try{
    const {data:{session}}=await db.auth.getSession();
    if(!session)throw Error('Link inválido ou expirado. Solicite uma nova recuperação.');
    const {error}=await db.auth.updateUser({password:one});
    if(error)throw error;
    el('status').textContent='Senha atualizada! Você já pode entrar.';
    el('reset').hidden=true;
    await db.auth.signOut();
   }catch(err){el('status').textContent=err.message}
   finally{el('save').disabled=false}
  };
 }catch(err){el('status').textContent='Falha na recuperação: '+err.message}
})();
</script></body></html>
