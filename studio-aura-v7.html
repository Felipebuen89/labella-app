function pad(n){return String(n).padStart(2,'0')}
function localDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function plusDays(n){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return localDate(d)}
function brDate(s){return new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}

function currency(n){return Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

   {id:'demo-4',who:'Isabela',service:'tratamento',pro:'bia',date:plusDays(2),time:'11:00',status:'confirmado',rewarded:false}
  ],cash:[]
}}

if(!data||!Array.isArray(data.bookings)){data=makeSeed()}

var page='inicio', adminPage='resumo', category='Todos', bookService='corte', bookPro='bia', bookDate=plusDays(1), bookTime='', bookingDone=false, ownerDate=plusDays(1), campaignTitle='',campaignText='';

}
function render(){root.innerHTML=admin?adminScreen():clientScreen()}
document.addEventListener('change',function(e){if(e.target.id==='service-select'){bookService=e.target.value;bookTime='';render()}if(e.target.id==='owner-date'){ownerDate=e.target.value;render()}if(e.target.id==='campaign-title'){campaignTitle=e.target.value;render()}if(e.target.id==='campaign-text'){campaignText=e.target.value;render()}});
document.addEventListener('input',function(e){if(e.target.id==='campaign-title'){campaignTitle=e.target.value}if(e.target.id==='campaign-text'){campaignText=e.target.value}});
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a'),v=b.getAttribute('data-v');
 if(a==='go')return newPage(v);
 if(a==='admin-go')return newAdminPage(v);
 if(a==='cat'){category=v;return render()}
 if(a==='book-service'){bookService=v;bookTime='';return newPage('agendar')}
 if(a==='pro'){bookPro=v;bookTime='';return render()}
 if(a==='date'){bookDate=v;bookTime='';return render()}
 if(a==='time'){bookTime=v;return render()}
 if(a==='notify-info')return toast('Prévia: notificações reais precisam ser ativadas na versão conectada.');
 if(a==='notifications'){data.notifications=!data.notifications;save();render();return toast('Preferência de demonstração atualizada.')}
 if(a==='confirm-book'){
  if(!bookTime||freeSlots().indexOf(bookTime)<0)return toast('Este horário não está mais disponível.');
  data.bookings.push({id:'a'+Date.now(),who:'Você (demonstração)',service:bookService,pro:bookPro,date:bookDate,time:bookTime,status:'pendente',rewarded:false});
  save();bookingDone=true;render();return
 }
 if(a==='cancel'){
  var found=data.bookings.find(function(x){return x.id===v});if(found&&found.status!=='concluido'){found.status='cancelado';save();render();toast('Agendamento simulado cancelado.')}return
 }
 if(a==='reschedule'){
  var old=data.bookings.find(function(x){return x.id===v});if(!old)return;
  bookService=old.service;bookPro=old.pro;bookDate=old.date<plusDays(1)?plusDays(1):old.date;bookTime='';old.status='cancelado';save();newPage('agendar');return toast('Escolha um novo horário. A reserva anterior foi cancelada neste demo.')
 }
 if(a==='redeem'){
  if(data.points<500)return toast('Você precisa de 500 pontos para este resgate.');
  data.points-=500;data.redeemed.push({date:plusDays(0),reward:'vale-50'});save();render();return toast('Resgate ilustrativo registrado. Não gera crédito real.')
 }
 if(a==='owner-status'){
  var bk=data.bookings.find(function(x){return x.id===v});if(!bk)return;
  var next=b.getAttribute('data-status');if(next==='confirmado'&&bk.status==='pendente')bk.status='confirmado';
  if(next==='concluido'&&bk.status==='confirmado'){bk.status='concluido';if(!bk.rewarded&&bk.who.indexOf('Você')===0){data.points+=svc(bk.service).price;bk.rewarded=true}}
  save();render();return toast('Atendimento atualizado na demonstração.')
 }
 if(a==='save-campaign'){
  var title=document.getElementById('campaign-title'),body=document.getElementById('campaign-text');if(title)campaignTitle=title.value.trim();if(body)campaignText=body.value.trim();
  if(!campaignTitle||!campaignText)return toast('Informe um título e uma mensagem.');
  data.campaigns.push({title:campaignTitle.slice(0,65),text:campaignText.slice(0,240),date:plusDays(0)});save();render();return toast('Rascunho salvo apenas neste navegador.')
 }
 if(a==='open-client'){location.href='studio-aura-v7.html';return}
 if(a==='reset'){if(confirm('Reiniciar os dados fictícios desta demonstração?')){data=makeSeed();save();render();toast('Demonstração reiniciada.')}return}
});
render();
})();
</script>
</body></html>
