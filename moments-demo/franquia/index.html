function cloudApplySeller(snap,initial=false){
 const key=snap.accountKey;
 if(!key)return;
 const payload=snap.payload||{},previousOrders=JSON.stringify(state.orders||[]);
 const previousNotices=new Set((state.notifications||[]).map(n=>String(n.id)));
 cloudPulling=true;
 if(initial){
  for(const f of sellerFields)if(payload[f]!==undefined)state[f]=payload[f];
  state.profile={...DEFAULT.profile,...(payload.profile||{}),revendedor:snap.name,name:(payload.profile?.name||'Revenda de '+snap.name),city:snap.city,whatsapp:snap.phone,code:key};
  state.currentSellerKey=key;
  state.sellerAccounts={[key]:Object.fromEntries(sellerFields.map(f=>[f,copyData(state[f]??(f==='profile'?DEFAULT.profile:f==='activeCoupon'?'':[]))]))};
 }
 state.orders=Array.isArray(snap.orders)?snap.orders:[];
 if(!Array.isArray(state.notifications))state.notifications=[];
 let added=false;
 for(const msg of snap.messages||[]){
  const id=String(msg.id);
  if(previousNotices.has(id))continue;
  state.notifications.unshift({id,title:msg.title,text:msg.text,when:msg.when,read:false});
  added=true;
 }
 const campaigns=(snap.messages||[]).filter(m=>m.kind==='campanha'&&m.campaign);
 state.promo=state.promo||[];state.coupons=state.coupons||[];
 for(const msg of campaigns){
  const p=msg.campaign;if(!p||!p.id)continue;
  if(!state.promo.some(x=>x.id===p.id))state.promo.push(p);
  if(p.coupon&&p.percent&&!state.coupons.some(x=>x.code===p.coupon))
   state.coupons.push({code:p.coupon,percent:p.percent,active:p.active!==false,end:p.end||''});
 }
 const settings=snap.settings||{};
 for(const k of ['loyaltyRule','training','raffles','priceOverride','photoOverride'])if(settings[k]!==undefined)state[k]=settings[k];
 if(state.sellerAccounts[key])for(const f of sellerFields)state.sellerAccounts[key][f]=copyData(state[f]??null);
 try{localStorage.setItem('moments_rev_demo_v4_zero_20261027',JSON.stringify(state))}catch(e){}
 cloudPulling=false;
 const changed=initial||added||JSON.stringify(state.orders)!==previousOrders;
 if(changed)render();
 if(added&&cloudInitialised&&'Notification' in window&&Notification.permission==='granted'){
  const newest=state.notifications[0];
  if('serviceWorker' in navigator)navigator.serviceWorker.ready.then(reg=>reg.showNotification('Moments Paris · '+newest.title,{body:newest.text,icon:'/assets/moments-logo-original-limpo.svg',tag:'moments-'+newest.id})).catch(()=>{});
 }
 cloudInitialised=true;
}

 const accounts={};
 for(const x of snap.sellers||[]){

async function cloudPoll(initial=false){

  if(FRANCHISE_PORTAL){if(cloudAdminSecret)cloudApplyAdmin(await CLOUD.admin(cloudAdminSecret))}
  else {const token=CLOUD.deviceToken();if(token)cloudApplySeller(await CLOUD.seller(token),initial)}
 }catch(e){console.warn('Moments live sync:',e.message)}

}

let latest=state.orders.slice(-4).reverse();let p=state.promo.filter(x=>!x.end||x.end>=today());return `${title('Bem-vindo ao seu negócio','Tudo o que você precisa para acompanhar suas vendas, em um só lugar.',`<button class="btn outline" data-act="profile">${ic('settings')} Minha loja</button>`)}<section class="hero"><div class="hero-copy"><p class="eyebrow">MOMENTS PARIS • REVENDA</p><h2>Seu talento para vender. <i>Seu negócio para crescer.</i></h2><p>Monte seu pedido em minutos, saiba o que tem no estoque e acompanhe cada venda e seu lucro.</p><button class="btn gold" data-tab="orders">Fazer novo pedido ${ic('arrow')}</button></div><div class="hero-photo" role="img" aria-label="Fotografia fornecida dos representantes da Moments Paris"></div></section>${p.length?`<div class="home-campaign"><div class="home-campaign-icon">${ic('gift')}</div><div><strong>CAMPANHA ATIVA</strong><h3>${esc(p[p.length-1].title)}</h3><p>${esc(p[p.length-1].text)}</p></div><button class="btn small gold" data-tab="promo">Ver oferta</button></div>`:'' }${notice()}<button type="button" class="loyalty-summary-home" data-tab="loyalty"><span><small>CLUBE DE FIDELIDADE</small><strong>${state.loyalty?.points||0} pontos disponíveis</strong><em>Ganhe pontos a cada venda registrada</em></span><b>Ver meus pontos →</b></button><section class="stat-grid">${stat('Valor investido em estoque',money(invest),'Produtos recebidos disponíveis','wallet')}${stat('Vendas realizadas',money(revenue),`${state.sales.length} registros de venda`,'bag')}${stat('Lucro realizado',money(profits),'Receita menos custo dos itens vendidos','chart')}${stat('Unidades disponíveis',owned,`${pending.length} pedido(s) a receber`,'boxes')}</section><div class="columns"><div class="panel"><div class="panel-head"><h3 class="panel-title">${reorders.length?'Hora de repor!':'Seus últimos pedidos'}</h3><button class="plain" data-tab="${reorders.length?'stock':'history'}">Ver tudo ${ic('arrow')}</button></div>${reorders.length?reorders.slice(0,4).map(id=>lineProduct(P[id],`Estoque zerado`,`<button class="btn light small" data-add="${id}">+ Repor</button>`)).join(''):latest.length?latest.map(o=>`<div class="item-line"><span class="mini-art">${ic('bag')}</span><div class="flex"><b>Pedido ${esc(o.id)}</b><small>${niceDate(o.createdAt)} • ${o.items.length} produto(s)</small></div><span class="pill ${o.received?'green':'orange'}">${esc(orderState(o))}</span></div>`).join(''):`<div class="empty"><div class="empty-icon">${ic('bag')}</div><h3>Seu primeiro pedido começa aqui</h3><p>Escolha seus produtos e envie a lista para sua franquia.</p><button class="btn" data-tab="orders">Explorar catálogo</button></div>`}</div><div class="panel"><div class="panel-head"><h3 class="panel-title">Novidades e promoções</h3><button class="plain" data-tab="promo">Ver campanhas</button></div>${p.length?`<div class="callout"><span class="eyebrow">NOVIDADE DA FRANQUIA</span><h3>${esc(p[0].title)}</h3><p>${esc(p[0].text)}</p><button class="btn small" data-tab="promo">Conferir oferta</button></div>`:`<div class="callout"><span class="eyebrow">CENTRAL DE OPORTUNIDADES</span><h3>Mais resultado com boas ofertas.</h3><p>As campanhas lançadas pela sua franquia aparecem aqui, com cupons e avisos exclusivos.</p><button class="btn light small" data-tab="promo">Acompanhar promoções</button></div>`}${pending.length?`<div class="notice">${ic('clock')} Você tem ${pending.length} pedido(s) aguardando retirada ou confirmação de entrada no estoque.</div>`:''}</div></div>${footer()}`}
function lineProduct(x,sub,actions){return `<div class="item-line"><span class="mini-art">${itemArt(x)}</span><div class="flex"><b>${esc(x.name)}</b><small>${esc(sub)}</small></div>${actions}</div>`}
function productCard(x){let q=qtyIn(x.id);return `<article class="product"><div class="art">${itemArt(x)}${!state.photoOverride[x.id]&&!x.image?'<small class="art-note">Foto pendente</small>':''}${state.reorder.includes(x.id)?'<span class="pill orange" style="position:absolute;top:10px;right:9px">Repor</span>':''}</div><div class="product-body"><div class="product-cat">${esc(x.category)}</div><div class="product-name" title="${esc(x.name)}">${esc(x.name)}</div><div class="product-cost">${money(cost(x))}<small class="product-cost-label">preço de compra</small></div><div class="product-retail">${x.retail!=null||state.retailOverride[x.id]!=null?'Venda sugerida: '+money(retail(x)):'Preço de venda a definir'}</div><div class="add-bar">${q?`<div class="qty-step qty-wide" role="group" aria-label="Quantidade de ${esc(x.name)}"><button data-qty="${x.id}" data-delta="-1" aria-label="Diminuir quantidade de ${esc(x.name)}">−</button><span aria-live="polite">${q} no pedido</span><button data-qty="${x.id}" data-delta="1" aria-label="Aumentar quantidade de ${esc(x.name)}">+</button></div>`:`<button class="btn gold product-add" data-add="${x.id}">${ic('plus')} Adicionar ao pedido</button>`}</div></div></article>`}
function cartUI(){let ar=Object.entries(state.cart).filter(([id,n])=>P[id]&&n>0);let t=totals();return `<div class="cart-panel" id="cart-panel"><h3>Meu pedido <span class="pill">${cartCount()} itens</span></h3><div class="cart-meta">Sua lista de compras para ${esc(state.profile.branch)}.</div>${ar.length?ar.map(([id,n])=>`<div class="cart-entry"><div class="cart-entry-name">${esc(P[id].name)}<div class="small-help">${n} × ${money(cost(P[id]))}</div><button class="plain" data-remove="${id}" style="font-size:10px">Remover</button></div><b>${money(cost(P[id])*n)}</b></div>`).join(''):`<div class="empty" style="padding:22px 4px"><div class="empty-icon">${ic('bag')}</div><p>Seu carrinho está vazio. Adicione produtos ao lado.</p></div>`}<div class="cost-summary"><div class="sum-row"><span>Subtotal</span><strong>${money(t.before)}</strong></div>${t.cp?`<div class="sum-row"><span>Cupom ${esc(t.cp.code)}</span><strong style="color:var(--green)">− ${money(t.off)}</strong></div>`:''}<div class="sum-row total"><span>Total do pedido</span><strong>${money(t.total)}</strong></div><button class="btn block gold" data-act="checkout" ${ar.length?'':'disabled'}>Finalizar pedido ${ic('arrow')}</button><div class="small-help" style="text-align:center;margin-top:12px">Na próxima etapa você escolhe data e horário da retirada.</div></div></div>`}

function categoryPicker(){
 const favorites=['Perfumes Masculinos 15 ml','Perfumes Femininos 15 ml','Perfumes 100 ml','Body Splash','Capilar & Cuidados','Perfumes & Corpo'];
 const titles={'Perfumes Masculinos 15 ml':'Masculinos 15 ml','Perfumes Femininos 15 ml':'Femininos 15 ml','Perfumes 100 ml':'Perfumes 100 ml','Perfumes 75 ml':'Perfumes 75 ml','Perfumes & Corpo':'Corpo e hidratantes','Óleos & Aromas':'Óleos e aromas','Suplementos':'Suplementos','Body Splash':'Body Splash','Maquiagem':'Maquiagem','Skincare':'Cuidados com a pele','Capilar & Cuidados':'Linha capilar','Acessórios & Apoio':'Acessórios'};
 const all=CATEGORIES.filter(c=>c!=='Todos');
 const visible=categoriesExpanded?all:[...favorites,...(filter!=='Todos'&&!favorites.includes(filter)?[filter]:[])].filter(c=>all.includes(c));
 return '<section class="category-browser" id="category-browser" aria-label="Categorias dos produtos">'+
 '<div class="category-browser-head"><div><div class="category-kicker">ESCOLHA A CATEGORIA</div><h3>O que você quer pedir?</h3></div><button class="category-clear" data-category="Todos" aria-pressed="'+(filter==='Todos')+'">Ver todos <small>('+PRODUCTS.length+')</small></button></div>'+
 '<div class="category-grid">'+visible.map(function(c){
  const count=PRODUCTS.filter(p=>p.category===c).length;
  const selected=filter===c;
  return '<button type="button" class="category-tile'+(selected?' active':'')+'" data-category="'+esc(c)+'" aria-pressed="'+selected+'"><span class="category-tile-title">'+esc(titles[c]||c)+'</span><small>'+count+' '+(count===1?'produto':'produtos')+'</small></button>';
 }).join('')+'</div>'+
 '<button type="button" class="category-expand" data-act="toggle-categories" aria-expanded="'+categoriesExpanded+'">'+(categoriesExpanded?'Mostrar menos categorias ↑':'Ver todas as '+all.length+' categorias ↓')+'</button>'+
 '</section>';
}

function orders(){return `${title('Faça seu pedido',`${PRODUCTS.length} opções organizadas por categorias. Selecione as quantidades e confira o total.`,`<button class="btn outline" data-act="${cartCount()?'checkout':'scroll-cart'}">${ic('bag')} ${cartCount()?'Revisar pedido':'Carrinho vazio'} (${cartCount()})</button>`)}${state.reorder.filter(id=>(state.inventory[id]?.qty||0)===0).length?`<div class="banner"><div><b>Reposição inteligente disponível</b><p>Alguns produtos zeraram no estoque. Adicione novamente ao seu carrinho.</p></div><button class="btn small" data-act="reorder-all">Repor estoque</button></div>`:''}${categoryPicker()}<div class="toolbar"><div class="searchbox">${ic('search')}<input id="product-search" value="${esc(query)}" placeholder="Buscar produto ou fragrância..." autocomplete="off" aria-label="Buscar produto"></div><span class="subtext"><strong id="match-count">${shownProducts().length}</strong> produtos encontrados</span></div><div class="catalog-result-title" id="catalog-results"><strong>${esc(filter==='Todos'?'Todos os produtos':filter)}</strong><span>${shownProducts().length} produtos</span></div><div class="catalog-layout"><div class="product-grid" id="product-grid">${shownProducts().map(productCard).join('')}</div>${cartUI()}</div>${footer()}`}
function shownProducts(){return PRODUCTS.filter(p=>(filter==='Todos'||p.category===filter)&&(!query||p.name.toLocaleLowerCase('pt-BR').includes(query.toLocaleLowerCase('pt-BR')))).sort((a,b)=>Number(state.reorder.includes(b.id))-Number(state.reorder.includes(a.id)))}
function stock(){let rows=Object.entries(state.inventory).filter(([id,obj])=>P[id]&&obj.qty>0);if(stockFilter==='Esgotados')rows=state.reorder.map(id=>[id,state.inventory[id]||{qty:0,avgCost:cost(P[id])}]).filter(([id,x])=>P[id]&&x.qty===0);let count=Object.values(state.inventory).reduce((a,b)=>a+(b.qty||0),0);let invested=Object.entries(state.inventory).reduce((a,[id,v])=>a+(v.qty||0)*(v.avgCost||0),0);let potential=Object.entries(state.inventory).reduce((a,[id,v])=>a+(v.qty||0)*(P[id]?(retail(P[id])??v.avgCost):0),0);let received=state.orders.filter(o=>!o.received&&orderState(o)!=='Recusado');return `${title('Meu estoque','Controle os produtos recebidos, registre vendas e receba alertas de reposição.',`<button class="btn outline" data-tab="orders">${ic('plus')} Comprar mais</button>`)}<div class="stat-grid">${stat('Investimento em estoque',money(invested),'Custo dos produtos disponíveis','wallet')}${stat('Valor de venda previsto',money(potential),'Pelos preços configurados','tag')}${stat('Lucro potencial',money(potential-invested),'Só se todo o estoque for vendido','chart')}${stat('Unidades em estoque',count,`${rows.length} referências visíveis`,'boxes')}</div>${received.length?`<div class="panel" style="margin-bottom:17px"><div class="panel-head"><h3 class="panel-title">${ic('clock')} Aguardando recebimento</h3><span class="pill orange">${received.length} pedido(s)</span></div><p class="subtext">Pedidos aguardam aprovação e liberação da franquia. Confirme o recebimento somente quando estiverem prontos para retirada.</p>${received.map(o=>`<div class="order-line"><div><strong>Pedido ${esc(o.id)}</strong><div class="subtext">${esc(orderState(o))} • Retirada ${niceDate(o.pickupDate)} às ${esc(o.pickupTime)} • ${o.items.reduce((s,i)=>s+i.qty,0)} unidade(s)</div></div>${canReceive(o)?`<button class="btn green small" data-receive="${o.id}">${ic('check')} Recebi</button>`:orderBadge(o)}</div>`).join('')}</div>`:''}<div class="panel" style="padding:17px"><div class="panel-head"><h3 class="panel-title">Produtos disponíveis</h3><div class="simple-tabs" style="margin:0"><button class="${stockFilter==='Todos'?'active':''}" data-stockfilter="Todos">Em estoque</button><button class="${stockFilter==='Esgotados'?'active':''}" data-stockfilter="Esgotados">Zerados (${state.reorder.length})</button></div></div>${rows.length?`<div class="table-wrap" style="border:0"><table class="data-table stock-table"><thead><tr><th>Produto</th><th>Quantidade</th><th>Custo médio</th><th>Venda</th><th>Potencial</th><th>Ação</th></tr></thead><tbody>${rows.sort((a,b)=>P[a[0]].name.localeCompare(P[b[0]].name)).map(([id,obj])=>{let x=P[id];let qty=obj.qty||0;return `<tr><td><b class="table-name" title="${esc(x.name)}">${esc(x.name)}</b><div class="label-muted">${esc(x.category)}</div></td><td><span class="pill ${qty===0?'red':'green'}">${qty} un.</span></td><td>${money(obj.avgCost)}</td><td><button class="plain" data-editprice="${id}">${retail(x)==null?'Definir preço':money(retail(x))} ✎</button></td><td><b>${retail(x)==null?'A definir':money(qty*(retail(x)-obj.avgCost))}</b></td><td>${qty>0?`<button class="sale-btn" data-sell="${id}">✓ Vendeu</button>`:`<button class="btn light small" data-add="${id}">+ Repor</button>`}</td></tr>`}).join('')}</tbody></table></div>`:empty('Nenhum produto por aqui',stockFilter==='Esgotados'?'Quando algum item zerar, aparecerá aqui para reposição.':'Faça seu primeiro pedido e confirme o recebimento para montar seu estoque.','boxes',`<button class="btn" data-tab="orders">Fazer pedido</button>`)}</div>${footer()}`}
function empty(head,body,icon='info',btn=''){return `<div class="empty"><div class="empty-icon">${ic(icon)}</div><h3>${head}</h3><p>${body}</p>${btn}</div>`}
const startWeek=d=>{let date=new Date(d+'T12:00:00');let dow=(date.getDay()+6)%7;date.setDate(date.getDate()-dow);return date.toLocaleDateString('en-CA')};
const isInPeriod=s=>{const d=s.date||(s.createdAt||'').slice(0,10);const curr=today();if(salesPeriod==='dia')return d===curr;if(salesPeriod==='semana')return startWeek(d)===startWeek(curr);if(salesPeriod==='mes')return d.slice(0,7)===curr.slice(0,7);return d.slice(0,4)===curr.slice(0,4)};
function finance(){const ss=state.sales.filter(isInPeriod).slice().reverse();let revenue=ss.reduce((a,s)=>a+s.total,0),costs=ss.reduce((a,s)=>a+s.cost,0),profit=revenue-costs;let days=[];for(let d=6;d>=0;d--){let date=new Date(today()+'T12:00:00');date.setDate(date.getDate()-d);let key=date.toLocaleDateString('en-CA');let val=state.sales.filter(s=>s.date===key).reduce((a,s)=>a+s.profit,0);days.push({key,val})}let max=Math.max(1,...days.map(d=>d.val));return `${title('Meu financeiro','Saiba quanto vendeu e quanto realmente lucrou, com visão diária, semanal, mensal e anual.',`<button class="btn outline" data-act="export-csv">${ic('download')} Exportar vendas</button>`)}<div class="simple-tabs">${[['dia','Hoje'],['semana','Esta semana'],['mes','Este mês'],['ano','Este ano']].map(([id,name])=>`<button class="${salesPeriod===id?'active':''}" data-period="${id}">${name}</button>`).join('')}</div><div class="insights">${[['Faturamento',revenue,'Valor total vendido'],['Custo das mercadorias',costs,'Custo efetivo dos itens vendidos'],['Lucro bruto',profit,'Antes de taxas e despesas adicionais']].map(([l,v,s])=>`<div class="insight"><small>${l}</small><strong>${money(v)}</strong><p>${s}</p></div>`).join('')}</div><div class="columns mt20"><div class="panel"><div class="panel-head"><h3 class="panel-title">Lucro dos últimos 7 dias</h3><span class="pill">${money(days.reduce((a,d)=>a+d.val,0))}</span></div><div class="bars">${days.map(d=>`<div class="bar-wrap"><div class="bar-val">${d.val>0?Math.round(d.val):''}</div><div class="bar" style="height:${Math.max(2,d.val/max*154)}px"></div><div class="bar-label">${d.key.slice(-2)}</div></div>`).join('')}</div><p class="small-help" style="text-align:center;margin-top:13px">Dias do mês • valores em reais</p></div><div class="panel"><div class="panel-head"><h3 class="panel-title">Resumo do período</h3></div><div class="sum-row"><span>Vendas registradas</span><strong>${ss.length}</strong></div><div class="sum-row"><span>Unidades vendidas</span><strong>${ss.reduce((a,s)=>a+s.qty,0)}</strong></div><div class="sum-row"><span>Ticket médio</span><strong>${money(ss.length?revenue/ss.length:0)}</strong></div><div class="sum-row"><span>Margem bruta</span><strong>${revenue?(profit/revenue*100).toFixed(1).replace('.',','):'0,0'}%</strong></div><div class="notice">Os resultados calculam lucro bruto. Frete, impostos, deslocamento e outras despesas não estão incluídos.</div></div></div><div class="panel mt20"><div class="panel-head"><h3 class="panel-title">Vendas do período</h3><span class="pill">${ss.length} venda(s)</span></div>${ss.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Data</th><th>Produto</th><th>Unidades</th><th>Receita</th><th>Custo</th><th>Lucro</th></tr></thead><tbody>${ss.map(s=>`<tr><td>${niceDate(s.date)}</td><td>${esc(s.name)}</td><td>${s.qty}</td><td>${money(s.total)}</td><td>${money(s.cost)}</td><td style="color:var(--green);font-weight:800">${money(s.profit)}</td></tr>`).join('')}</tbody></table></div>`:empty('Sem vendas neste período','Assim que você clicar em “Vendeu” no estoque, os resultados aparecem aqui.','chart')}</div>${footer()}`}
function promos(){const pp=state.promo.filter(p=>p.active!==false&&(!p.end||p.end>=today()));return `${title('Promoções e novidades','Campanhas, ofertas e cupons divulgados pela sua franquia.',`<button class="btn outline" data-act="notifications">${ic('bell')} Ver avisos</button>`)}${pp.length?`<div class="promos">${pp.slice().reverse().map(p=>`<div class="promo-card"><small>${p.coupon?'CUPOM ESPECIAL':'CAMPANHA EXCLUSIVA'}</small><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p><footer>${p.coupon?'Use o cupom '+esc(p.coupon):'Exclusivo para revendedores'}${p.end?' • até '+niceDate(p.end):''}</footer></div>`).join('')}</div>`:empty('Sua próxima campanha vem aí','Quando a franquia divulgar uma promoção, você poderá consultar tudo nesta aba.','gift')}<div class="panel mt20"><h3 class="panel-title">Como usar os cupons?</h3><p class="subtext">Adicione produtos em Pedidos, toque em Finalizar pedido e digite seu cupom antes de confirmar a retirada. Os cupons cadastrados pela franquia aplicam o desconto automaticamente.</p><button class="btn light small" data-tab="orders">Montar pedido ${ic('arrow')}</button></div>${footer()}`}
function history(){
 const orders=state.orders.slice().reverse();
 const buckets=[['Aguardando aprovação',orders.filter(o=>orderState(o)==='Aguardando aprovação')],['Aprovados e em preparação',orders.filter(o=>approvedState(o)&&!o.received)],['Recebidos',orders.filter(o=>o.received)],['Recusados',orders.filter(o=>orderState(o)==='Recusado')]];
 return `${title('Meus pedidos','Acompanhe o status, a aprovação, a retirada e a entrada no estoque.',`<button class="btn gold" data-tab="orders">${ic('plus')} Novo pedido</button>`)}<div class="order-step-legend"><b>1. Aguardando</b><span>2. Aprovado</span><span>3. Preparação</span><span>4. Recebido</span></div>
 ${orders.length?buckets.map(([group,ar])=>!ar.length?'':`<div class="orders-group"><h3>${esc(group)} <small>${ar.length}</small></h3>${ar.map(o=>`<div class="order-card"><div class="order-flex"><div><div class="eyebrow">PEDIDO ${esc(o.id)}</div><h3>${money(o.total)}</h3></div>${orderBadge(o)}</div><div class="order-meta">${o.items.reduce((a,i)=>a+i.qty,0)} unidade(s) • Criado ${niceDate(o.createdAt)} • Retirada ${niceDate(o.pickupDate)} às ${esc(o.pickupTime)}</div><div class="action-row mt20"><button class="btn light small" data-pdf="${o.id}">${ic('download')} PDF</button><button class="btn outline small" data-share="${o.id}">${ic('send')} Compartilhar</button><button class="btn outline small" data-orderdetail="${o.id}">Detalhes</button>${canReceive(o)?`<button class="btn green small" data-receive="${o.id}">${ic('check')} Recebi os produtos</button>`:''}</div></div>`).join('')}</div>`).join(''):empty('Nenhum pedido ainda','Selecione produtos no catálogo para começar.','bag',`<button class="btn gold" data-tab="orders">Fazer pedido</button>`)}${footer()}`;
}
const footer=()=>`<div class="footer-note">Moments Paris • Ferramenta de apoio ao revendedor. Fotos obtidas por produto em catálogo público; quando não há correspondência confirmada, exibimos arte sinalizada. Não é uma plataforma oficial publicada.</div>`;


const ADMIN_TABS=[['orders','Pedidos','bag'],['sellers','Revendedores','user'],['access','Acessos','user'],['campaigns','Campanhas','gift'],['benefits','Benefícios','gift'],['raffles','Sorteios','gift'],['training','Técnicas','sparkle'],['settings','Gestão','settings']];
let selectedSeller='';
function sellerSummary(key,a){
 const sales=a.sales||[],inv=a.inventory||{},orders=a.orders||[];
 return {key,name:a.profile?.revendedor||key,code:a.profile?.code||key,
  qty:Object.values(inv).reduce((n,o)=>n+(o.qty||0),0),
  accessCount:accessSummary(a).visits,lastAccess:accessSummary(a).last,loyaltyPoints:(a.loyalty?.points||0),
  inventoryCost:Object.values(inv).reduce((n,o)=>n+(o.qty||0)*(o.avgCost||0),0),
  revenue:sales.reduce((n,o)=>n+(o.total||0),0),
  profit:sales.reduce((n,o)=>n+(o.profit||0),0),
  units:sales.reduce((n,o)=>n+(o.qty||0),0),
  orders:orders.length,sales:sales.length};
}
function adminOrders(){
 const orders=allOrders().slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
 const pending=orders.filter(o=>orderState(o)==='Aguardando aprovação');
 const total=orders.filter(o=>orderState(o)!=='Recusado').reduce((n,o)=>n+o.total,0);
 return title('Pedidos recebidos','A franquia decide a aprovação. O estoque só entra depois de liberado e recebido.','','PAINEL DA FRANQUIA')+

function validMediaUrl(value){
 const s=String(value||'').trim();
 if(/^data:image\/(?:png|jpeg|webp|gif);base64,[a-zA-Z0-9+/=]+$/.test(s))return s;
 try{const u=new URL(s);return u.protocol==='https:'?u.href:''}catch(e){return ''}
}
function trainingDisplay(item){
 const url=validMediaUrl(item.url);
 if(item.kind==='image'&&url)return `<img class="training-image" src="${esc(url)}" loading="lazy" alt="${esc(item.title)}">`;
 if(item.kind==='video'&&url){
  let id='';
  try{const u=new URL(url);if(['youtube.com','www.youtube.com','m.youtube.com'].includes(u.hostname)){id=u.searchParams.get('v')||u.pathname.match(/^\/shorts\/([^/?]+)/)?.[1]||'';if(u.pathname.startsWith('/embed/'))id=u.pathname.split('/')[2]}else if(u.hostname==='youtu.be')id=u.pathname.split('/')[1]||''}catch(e){}
  if(/^[A-Za-z0-9_-]{11}$/.test(id))return `<div class="training-video"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="${esc(item.title)}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
  if(/\.mp4(?:\?|$)/i.test(url))return `<video class="training-video-file" controls preload="metadata" playsinline src="${esc(url)}"></video>`;
  return `<a class="btn outline" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${ic('arrow')} Assistir vídeo</a>`;
 }
 return '';
}

const safeMediaUrl=u=>/^https:\/\//i.test(String(u||'').trim())?String(u).trim():'';

const safeVideo=u=>/^(data:video\/(mp4|webm);base64,|https:\/\/)/i.test(String(u||'').trim())?String(u).trim():'';
function trainingContent(t){

 let contents='';
 if(img)contents+='<img class="training-image" loading="lazy" alt="Imagem de treinamento: '+esc(t.title)+'" src="'+esc(img)+'">';
 if(video){
  if(youtube)contents+='<iframe class="training-video" src="https://www.youtube-nocookie.com/embed/'+youtube[1]+'" title="'+esc(t.title)+'" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
  else if(/\.(mp4|webm)(\?|$)/i.test(video)||video.startsWith('data:video/'))contents+='<video class="training-video" controls preload="metadata" playsinline src="'+esc(video)+'"></video>';
  else contents+='<a class="btn light small" href="'+esc(video)+'" target="_blank" rel="noopener noreferrer">▶ Assistir ao vídeo</a>';
 }
 if(safeMediaUrl(t.link))contents+='<p><a href="'+esc(t.link)+'" class="btn outline small" target="_blank" rel="noopener noreferrer">Abrir material complementar ↗</a></p>';
 return contents;
}

async function saveTraining(d){
 if(!admin)return toast('Apenas o franqueado pode publicar treinamentos');
 const title=String(d.get('title')||'').trim(),description=String(d.get('description')||'').trim(),kind=String(d.get('kind')||'text');
 const url=validMediaUrl(d.get('url')||''),file=d.get('photo');
 if(!title||!description)return toast('Informe título e descrição');
 if(!['video','image','text'].includes(kind))return toast('Formato inválido');
 let contentUrl=url;
 if(file&&file.size){
  if(!/^image\/(png|jpeg|webp)$/.test(file.type))return toast('Selecione uma imagem JPG, PNG ou WebP');
  if(file.size>650000)return toast('Foto maior que 650 KB. Use uma imagem menor.');
  try{contentUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Leitura'));reader.readAsDataURL(file)})}
  catch(e){return toast('Erro ao ler a imagem')}
 }
 if(kind==='video'&&!url)return toast('Informe o link HTTPS do vídeo');
 if(kind==='image'&&!contentUrl)return toast('Informe a foto ou seu link');
 const entry={id:'TR-'+rand()+Date.now(),title,description,text:description,kind,url:contentUrl||'',image:kind==='image'?contentUrl:'',video:kind==='video'?url:'',link:'',createdAt:nowISO(),active:true};
 state.training.push(entry);
 broadcastSellerMessage('Nova técnica de venda',title+' disponível na aba Técnicas de venda');

onto do cupom</span><strong id="checkout-discount">− ${money(t.off)}</strong></div>${t.rewardOff?`<div class="sum-row"><span>Crédito de fidelidade</span><strong>− ${money(t.rewardOff)}</strong></div>`:''}<div class="sum-row total"><span>Total do pedido</span><strong id="checkout-total">${money(t.total)}</strong></div><button class="btn gold block" type="submit">${ic('check')} Enviar para aprovação</button></form><div class="small-help" style="margin-top:15px">O pedido ficará aguardando aprovação da franquia e só entrará no estoque depois de liberado para retirada e recebido.</div>`)}

async function receiveOrder(id){
 const o=state.orders.find(o=>o.id===id);
 if(!o)return;if(o.received)return toast('Este pedido já foi recebido');
 if(!canReceive(o))return toast('A franquia precisa marcar o pedido como Pronto para retirada');
 try{await CLOUD.receive(CLOUD.deviceToken(),id)}catch(e){return toast('Recebimento não confirmado: '+e.message)}
 o.items.forEach(i=>{const old=state.inventory[i.id]||{qty:0,avgCost:0};const n=old.qty+i.qty;const avg=(old.qty*old.avgCost+i.qty*(i.effectiveUnitCost??i.unitCost))/n;state.inventory[i.id]={qty:n,avgCost:+avg.toFixed(4)};state.reorder=state.reorder.filter(x=>x!==i.id)});
 o.received=true;o.receivedAt=nowISO();o.status='Recebido';
 notify('Estoque atualizado','Pedido '+id+' entrou no seu estoque.',false);
 save();render();toast('Produtos recebidos e liberados para venda!');
}

function recordSale(fd){let id=fd.get('id'),x=P[id],o=state.inventory[id],q=Number(fd.get('qty')),price=Number(fd.get('price'));if(!x||!o||!Number.isInteger(q)||q<1||q>o.qty||!Number.isFinite(price)||price<=0)return toast('Confira quantidade e preço de venda');let sale={id:'VD-'+rand()+'-'+Date.now().toString().slice(-5),createdAt:nowISO(),date:today(),productId:id,name:x.name,qty:q,unitPrice:price,unitCost:o.avgCost,total:+(price*q).toFixed(2),cost:+(o.avgCost*q).toFixed(2),profit:+((price-o.avgCost)*q).toFixed(2),sellerKey:state.currentSellerKey,reseller:state.profile.revendedor,channel:String(fd.get('channel')||'Não informado')};state.sales.push(sale);
const lp=state.loyalty||(state.loyalty=blankLoyalty());
const rule=state.loyaltyRule;
const sumForPoints=Number(sale.total||0)+Number(lp.remainder||0);
const steps=Math.floor((sumForPoints+0.0000001)/rule.saleStep);
const gained=steps*rule.pointsPerStep;
lp.remainder=+(sumForPoints-steps*rule.saleStep).toFixed(2);
if(gained){lp.points+=gained;lp.earned+=gained;lp.history.push({date:nowISO(),delta:gained,text:'Venda '+sale.id+' · '+sale.name});}
o.qty-=q;if(o.qty===0&&!state.reorder.includes(id)){state.reorder.push(id);notify('Hora de repor o estoque',`${x.name} acabou e foi colocado na lista de reposição.`,false)}save();closeModal();render();toast('Venda registrada • +'+gained+' ponto(s) · lucro '+money(sale.profit))}

function pdfEsc(s){return simpleAscii(s).replace(/[\\()]/g,'\\$&')}

const MP_PUBLIC_KEY='sb_publishable_yrujwXvWHWPCFyjqia9kgA_MXcbsH0D';
let mpFeedItems=[];let mpFeedSeen='';
function mpFeedOpen(){const item=mpFeedItems[0];if(!item)return;const box=document.getElementById('mp-shared-feed');if(!box)return;box.innerHTML='';const h=document.createElement('strong');h.textContent=item.title;const p=document.createElement('p');p.textContent=item.body;const kind=document.createElement('small');kind.textContent=item.kind==='campanha'?'Campanha da Moments Paris':'Comunicado da Moments Paris';const close=document.createElement('button');close.textContent='Entendi';close.onclick=()=>{localStorage.setItem('mp-feed-seen',item.id);mpFeedSeen=item.id;box.remove()};box.append(kind,h,p,close)}
async function mpFeedCheck(){try{const response=await fetch(MP_FEED_URL,{headers:{apikey:MP_PUBLIC_KEY}});if(!response.ok)return;const data=await response.json();if(!Array.isArray(data)||!data.length)return;mpFeedItems=data;const item=data[0];if(item.id===mpFeedSeen||item.id===localStorage.getItem('mp-feed-seen'))return;let box=document.getElementById('mp-shared-feed');if(!box){box=document.createElement('aside');box.id='mp-shared-feed';box.setAttribute('role','status');document.body.append(box)}mpFeedOpen()}catch(e){/* network may be unavailable offline */}}
if(!FRANCHISE_PORTAL){mpFeedSeen=localStorage.getItem('mp-feed-seen')||'';mpFeedCheck();setInterval(()=>{if(!document.hidden)mpFeedCheck()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)mpFeedCheck()})}
function init(){setupEventHandlers();if(!FRANCHISE_PORTAL)logSellerAccess('abertura do app');render(true);cloudStart().catch(e=>toast('Erro de sincronização: '+e.message));setInterval(()=>{if(!document.hidden)cloudPoll()},20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)cloudPoll()});if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('SW:',e.message));}init();
})();
</script></body></html>
