function site(){return '<div class="site"><div class="demo-strip">PROTÓTIPO CONCEITUAL · NÃO É O SITE OFICIAL DA CLÍNICA</div><header class="site-nav">'+logo()+'<nav id="site-menu" class="'+(menuOpen?'open':'')+'"><a href="#tratamentos">Tratamentos</a><a href="#sobre">A clínica</a><a href="#experiencia">Experiência</a><a href="#localizacao">Localização</a><a href="https://www.instagram.com/marciacalixto_estetica/" target="_blank" rel="noopener">Instagram ↗</a></nav><button class="btn sm" data-action="request" data-val="avaliacao">Solicitar avaliação</button><button class="menu-toggle" aria-label="Abrir menu" data-action="menu">☰</button></header><main><section class="site-hero"><div class="site-hero-inner"><div><span class="eyebrow">VALINHOS · ESTÉTICA, SAÚDE E AUTOCUIDADO</span><h1>Um cuidado<br>que respeita <i>a sua essência.</i></h1><p>Na Márcia Calixto Estética e Saúde, o primeiro passo é entender você. Conheça os cuidados faciais, corporais e experiências de bem-estar divulgados pela clínica.</p><div class="hero-actions"><button class="btn" data-action="request" data-val="avaliacao">Quero conhecer os cuidados ↗</button><a class="btn alt" href="#tratamentos">Explorar tratamentos</a></div><p class="tiny muted mt">Atendimentos e procedimentos sujeitos à avaliação e confirmação da equipe.</p></div><div class="hero-visual"><div class="hero-portrait"><img src="'+photos.hero+'" alt="Imagem de referência de spa e autocuidado, não é a clínica"></div><div class="floating-note"><span class="eyebrow">NOSSO PROPÓSITO</span><strong>Você, com mais atenção.</strong></div></div></div></section><section class="site-section" id="tratamentos"><div class="section-top"><div class="section-intro"><span class="eyebrow">ESCOLHA POR ONDE COMEÇAR</span><h2>Tratamentos para momentos e necessidades diferentes.</h2><p>Organizamos os serviços divulgados para você compreender cada proposta antes de solicitar uma avaliação.</p></div><span class="pill teal">Catálogo em validação</span></div><div class="chips">'+categories.map(c=>'<button class="'+(siteFilter===c?'on':'')+'" data-action="site-filter" data-val="'+c+'">'+c+'</button>').join('')+'</div><div class="service-grid">'+services.filter(s=>siteFilter==='Todos'||s.cat===siteFilter).map(siteServiceCard).join('')+'</div><p class="filter-note">*Procedimentos encontrados nas redes da clínica. A oferta, os profissionais habilitados e as condições precisam de aprovação antes do lançamento.</p></section><section class="pale" id="sobre"><div class="site-section about-grid"><div class="about-image"><img loading="lazy" src="'+photos.space+'" alt="Fotografia de referência de ambiente de bem-estar, não é o estabelecimento"></div><div class="about-copy"><span class="eyebrow">A EXPERIÊNCIA MÁRCIA CALIXTO</span><h2 class="serif">Mais que um tratamento, um encontro com seu bem-estar.</h2><p>O perfil profissional da clínica destaca estética, massoterapia e acolhimento feminino. Nossa proposta digital valoriza essas características e conduz a cliente para uma avaliação individualizada.</p><p>Não reproduzimos currículos, certificações ou depoimentos sem confirmação: nesta fase, a história e as imagens reais da Márcia serão incorporadas somente após aprovação.</p><div class="truth-points"><div><span>✧</span><b>Apresentação transparente dos procedimentos</b></div><div><span>♡</span><b>Orientação para avaliação profissional</b></div><div><span>✿</span><b>Acompanhamento das visitas e sessões</b></div></div></div></div></section><section class="site-section" id="experiencia"><div class="section-intro"><span class="eyebrow">CUIDADO EM CADA ETAPA</span><h2>Uma jornada mais simples.</h2><p>O site recebe a cliente; o aplicativo facilita a continuidade do atendimento.</p></div><div class="steps-grid"><div class="step-card"><span class="number">01</span><h3>Conheça</h3><p>Encontre serviços, informações e referências da clínica em um só lugar.</p></div><div class="step-card"><span class="number">02</span><h3>Converse</h3><p>Solicite uma avaliação para esclarecer opções, necessidades e expectativas.</p></div><div class="step-card"><span class="number">03</span><h3>Acompanhe</h3><p>Na experiência futura, organize visitas, sessões de pacotes e benefícios.</p></div></div></section><section class="site-section" style="padding-top:0"><div class="app-promo"><div><span class="eyebrow" style="color:#ddcac3">UM NOVO JEITO DE CUIDAR</span><h2>Seu autocuidado continua no aplicativo.</h2><p>Agenda pessoal, acompanhamento de sessões, clube de benefícios e novidades da clínica — tudo em uma experiência organizada.</p>'+linkView('app','Explorar demonstração do aplicativo →','alt')+'</div><div class="promo-phone"><div class="eyebrow">MINHA JORNADA</div><h3 class="serif" style="font-size:25px;margin:12px 0">Cada encontro faz parte da sua história.</h3><p class="small muted" style="margin:0 0 14px">Drenagem linfática · pacote exemplo</p><div class="mini-progress"><span></span></div><p class="small" style="margin:9px 0 17px">2 de 6 sessões concluídas</p><div class="pill teal">Seu próximo cuidado organizado</div></div></div></section><section class="site-section" id="localizacao" style="padding-top:15px"><div class="section-intro"><span class="eyebrow">VENHA NOS CONHECER</span><h2>Márcia Calixto em Valinhos.</h2></div><div class="location-grid"><div><h3 class="serif" style="font-size:30px">Estamos no Jardim Santa Maria.</h3><p class="muted">Rua Agostinho Ferrari, nº 37<br>Santa Maria · Valinhos, SP<br>CEP 13272-811</p><p class="small muted">O horário de atendimento e o telefone oficial devem ser confirmados antes da publicação.</p><div class="row wrap"><a class="btn teal" href="https://www.google.com/maps/place/Est%C3%A9tica+%26+Beleza+M%C3%A1rcia+Calixto+-+Ozonioterapeuta+-+Valinhos/@-22.9440155,-47.0004527,17z/data=!3m1!4b1!4m6!3m5!1s0x94c8cf08b51689c1:0x35d69ada9e44ed73!8m2!3d-22.9440155!4d-46.9978778!16s%2Fg%2F11kq9hdgzr" target="_blank" rel="noopener">Abrir mapa ↗</a><a class="btn alt" href="https://www.instagram.com/marciacalixto_estetica/" target="_blank" rel="noopener">Ver Instagram</a></div></div><div class="location-art"><div class="pin">⌖</div><h3 class="serif" style="font-size:28px">Valinhos, São Paulo</h3><p class="muted small">Prévia: substituir por mapa integrado e imagens da fachada após aprovação.</p></div></div></section></main><footer class="site-footer"><div class="footer-inner">'+logo()+'<div><p>Prévia independente Move Digital. Marca original e conteúdo final sujeitos à autorização.</p><div class="row wrap"><button class="link" style="color:#f3dfe4" data-action="view" data-val="app">Ver aplicativo →</button><button class="link" style="color:#f3dfe4" data-action="view" data-val="owner">Painel de demonstração →</button></div></div></div></footer></div>'}

rogress"><span style="width:'+Math.min(100,100*state.package.done/state.package.total)+'%"></span></div><button class="link" data-action="appnav" data-val="journey">Acompanhar minhas sessões →</button></div><div class="app-card" style="background:var(--mint)"><span class="eyebrow" style="color:var(--teal)">CLUBE MC</span><div class="row between mt"><div><b style="font:normal 24px var(--display)">'+state.points+' pontos</b><p class="small muted" style="margin:4px 0 0">Benefícios ilustrativos disponíveis</p></div><button class="btn teal sm" data-action="appnav" data-val="club">Ver clube</button></div></div></section>'}

function appointmentsList(){let list=state.appointments.slice().sort((a,b)=>a.date.localeCompare(b.date));return list.length?list.map(a=>'<div class="app-card"><div class="row between"><span class="pill">'+shortDate(a.date)+' · '+a.time+'</span><span class="pill '+(a.status==='confirmado'?'teal':'neutral')+'">'+(a.status==='confirmado'?'Confirmado':'Concluído')+'</span></div><strong style="font-size:13px;display:block;margin-top:13px">'+clean(byService(a.service).title)+'</strong><p class="small muted" style="margin:6px 0 0">Agendamento simulado · '+clean(a.client)+'</p></div>').join(''):'<div class="empty">Nenhum atendimento na agenda demonstrativa.</div>'}
function availableTimes(){let hours=['09:00','10:00','11:00','14:00','15:00','16:00'];return hours.filter(t=>!state.appointments.some(a=>a.date===bookingDate&&a.time===t&&a.status==='confirmado'))}
function appAgenda(){let bookable=services.filter(s=>s.mode==='book');return '<section>'+appHead()+'<span class="eyebrow">MINHA AGENDA</span><h1 class="app-lead">Organize seu<br>próximo cuidado.</h1><p class="small muted">Simule um agendamento. Este calendário não consulta a agenda real da clínica.</p><div class="app-card"><label class="field" style="margin-top:0">Serviço para simulação<select id="select-service">'+bookable.map(s=>'<option value="'+s.id+'" '+(bookingService===s.id?'selected':'')+'>'+clean(s.title)+'</option>').join('')+'</select></label><div class="eyebrow mt">ESCOLHA UM DIA</div><div class="day-strip">'+Array.from({length:7},(_,i)=>isoDays(i+1+week*7)).map(d=>'<button data-action="day" data-val="'+d+'" class="'+(bookingDate===d?'on':'')+'"><span>'+weekday(d)+'</span><b>'+d.slice(-2)+'</b></button>').join('')+'</div><div class="row between"><button class="link" data-action="weekprev" '+(week===0?'disabled':'')+'>← Anterior</button><span class="small muted">Semana '+(week+1)+' de 3</span><button class="link" data-action="weeknext" '+(week===2?'disabled':'')+'>Próxima →</button></div><p class="small muted" style="margin:18px 0 0">Horários fictícios</p><div class="slots">'+availableTimes().map(t=>'<button class="'+(bookingTime===t?'on':'')+'" data-action="time" data-val="'+t+'">'+t+'</button>').join('')+'</div><button class="btn block" data-action="confirm-booking" '+(!bookingTime?'disabled':'')+'>Registrar reserva demonstrativa →</button></div><h2 class="app-h3">Meus agendamentos</h2>'+appointmentsList()+'<p class="app-foot">A agenda real só será disponibilizada após integração com a clínica.</p></section>'}
function appJourney(){return '<section>'+appHead()+'<span class="eyebrow">MEUS TRATAMENTOS</span><h1 class="app-lead">Cada visita, no<br>seu tempo.</h1><div class="app-card"><span class="pill teal">EXEMPLO DE PACOTE</span><h2 class="serif" style="font-size:28px;margin:14px 0">'+clean(state.package.title)+'</h2><p class="small muted">Este pacote foi criado apenas para demonstrar como uma cliente poderá acompanhar as sessões contratadas.</p><div class="row between" style="margin-top:20px"><strong style="font-size:13px">Sessões concluídas</strong><strong style="font-size:13px">'+state.package.done+' de '+state.package.total+'</strong></div><div class="progress"><span style="width:'+Math.min(100,100*state.package.done/state.package.total)+'%"></span></div><div class="package-steps">'+Array.from({length:state.package.total},(_,i)=>'<div class="'+(i<state.package.done?'done':i===state.package.done?'next':'')+'">'+(i<state.package.done?'✓':i+1)+'</div>').join('')+'</div><div class="row between"><span class="pill teal">'+(state.package.total-state.package.done)+' sessões restantes</span><button class="btn soft sm" data-action="appnav" data-val="agenda">Ver agenda</button></div></div><div class="app-card"><h3 class="serif" style="font-size:23px">Orientações importantes</h3><p class="small muted">Em produção, a clínica poderá disponibilizar orientações aprovadas para cada modalidade, com acesso privado. Esta prévia não contém prontuários, imagens clínicas ou recomendações individuais.</p></div><div class="app-card"><h3 class="serif" style="font-size:23px">Seu próximo passo</h3><p class="small muted">Organize suas próximas sessões e tire dúvidas diretamente com a equipe. Na demonstração, o atendimento não recebe mensagens.</p><button class="btn soft" data-action="appnav" data-val="agenda">Ir para minha agenda</button></div></section>'}
function appClub(){let progress=Math.min(100,state.earned/300*100);return '<section>'+appHead()+'<span class="eyebrow">BENEFÍCIOS</span><h1 class="app-lead">Seu cuidado também<br>merece recompensas.</h1><div class="club-card"><div class="row between"><span class="eyebrow" style="color:#e9cfda">CLUBE MC · DEMONSTRAÇÃO</span><span>✧</span></div><div class="club-count">'+state.points+' <span style="font:normal 15px var(--body)">pontos</span></div><p>Saldo disponível para resgates demonstrativos</p><div class="progress"><span style="width:'+progress+'%"></span></div><p class="tiny">'+state.earned+' pontos acumulados · exemplos sem valor real</p></div><h2 class="app-h3">Recompensas</h2>'+rewards.map(r=>'<div class="reward-card"><div class="gift">'+r.emoji+'</div><div><strong>'+r.title+'</strong><p>'+r.points+' pontos</p></div><button class="btn '+(state.points>=r.points?'':'soft')+' sm" data-action="'+(state.points>=r.points?'redeem':'reward-info')+'" data-val="'+r.id+'">'+(state.points>=r.points?'Resgatar':'Faltam '+(r.points-state.points))+'</button></div>').join('')+'<div class="app-card mt2"><h3 class="serif" style="font-size:22px">Como funciona?</h3><p class="small muted">Na demonstração, cada atendimento concluído soma 30 pontos. Na versão real, a clínica definirá todas as regras, prazos e benefícios antes de disponibilizá-los às clientes.</p></div></section>'}
function appProfile(){return '<section>'+appHead()+'<span class="eyebrow">MINHA ÁREA</span><h1 class="app-lead">Seu espaço<br>exclusivo.</h1><div class="app-card row"><div style="width:49px;height:49px;border-radius:50%;background:var(--wine-soft);color:var(--wine);display:grid;place-items:center;font:normal 24px var(--display)">M</div><div class="grow"><strong>'+clean(state.client)+'</strong><p class="small muted" style="margin:4px 0 0">Perfil fictício para demonstração</p></div><span class="pill">DEMO</span></div><h2 class="app-h3">Minhas informações</h2><div class="app-card"><div class="row between"><div><strong>Notificações do aplicativo</strong><p class="small muted" style="margin:3px 0 0">Preferência simulada</p></div><button class="btn sm soft" data-action="notification-toggle">'+(state.settings.notifications?'Ativadas':'Desativadas')+'</button></div><div class="line"></div><div class="row between"><div><strong>Recompensas disponíveis</strong><p class="small muted" style="margin:3px 0 0">'+state.coupons.length+' cupom(ns) fictícios</p></div><button class="link" data-action="appnav" data-val="club">Ver clube →</button></div></div><h2 class="app-h3">Meus cupons</h2>'+(state.coupons.length?state.coupons.map(c=>'<div class="app-card"><strong>'+clean(c.title)+'</strong><p class="small muted">Código demonstrativo: '+clean(c.code)+'</p></div>').join(''):'<div class="app-card"><p class="small muted" style="margin:0">Seus cupons resgatados aparecerão aqui.</p></div>')+'<button class="btn alt block" style="margin-top:18px" data-action="view" data-val="site">Conhecer o site da clínica →</button><p class="app-foot">Sem autenticação e sem dados reais de saúde nesta versão.</p></section>'}
function app(){return '<div class="demo-app-outer"><div class="demo-guide">APP CONCEITUAL · Fotos e informações ilustrativas, dados guardados somente neste navegador · Não possui login nem agenda real</div>'+switcher()+'<div class="app-frame"><main class="app-screen">'+({home:appHome,treatments:appTreatments,agenda:appAgenda,journey:appJourney,club:appClub,profile:appProfile}[appTab]||appHome)()+'</main><nav class="nav-bottom" aria-label="Menu do aplicativo">'+[['home','⌂','Início'],['treatments','✿','Cuidados'],['agenda','▦','Agenda'],['club','✧','Clube'],['profile','♡','Perfil']].map(x=>'<button data-action="appnav" data-val="'+x[0]+'" class="'+(appTab===x[0]?'on':'')+'" '+(appTab===x[0]?'aria-current="page"':'')+'><span>'+x[1]+'</span>'+x[2]+'</button>').join('')+'</nav></div></div>'}
const adminTabs=[['overview','▤','Visão geral'],['agenda','▦','Agenda'],['requests','✉','Avaliações'],['packages','✿','Pacotes'],['campaigns','✧','Campanhas'],['loyalty','♧','Clube MC'],['finance','◈','Financeiro']];
function ownerNav(){return adminTabs.map(x=>'<button class="'+(ownerTab===x[0]?'on':'')+'" data-action="ownernav" data-val="'+x[0]+'">'+x[1]+' '+x[2]+'</button>').join('')}
function ownerHome(){let future=state.appointments.filter(a=>a.status==='confirmado'),pending=state.requests.filter(r=>r.status==='nova');return '<div class="stat-grid"><div class="stat"><small>Solicitações novas</small><strong>'+pending.length+'</strong><small>Aguardam revisão</small></div><div class="stat"><small>Agendamentos demo</small><strong>'+future.length+'</strong><small>Simulações ativas</small></div><div class="stat"><small>Sessões restantes</small><strong>'+(state.package.total-state.package.done)+'</strong><small>Pacote ilustrativo</small></div><div class="stat"><small>Campanhas ativas</small><strong>'+state.campaigns.filter(c=>c.active).length+'</strong><small>Campanhas fictícias</small></div></div><div class="owner-columns"><div class="owner-card"><div class="row between"><h2>Próximos atendimentos</h2><button class="link" data-action="ownernav" data-val="agenda">Abrir agenda →</button></div>'+ownerBookingRows(future)+'</div><div class="owner-card"><div class="row between"><h2>Avaliações solicitadas</h2><button class="link" data-action="ownernav" data-val="requests">Ver todas →</button></div>'+ownerRequestRows(pending)+'</div></div><div class="owner-card" style="margin-top:12px"><h2>Mais tempo para cuidar das clientes</h2><p class="small muted">Esta demonstração conecta solicitações do site, horários do aplicativo, acompanhamento de sessões e campanhas locais. Antes do uso comercial, precisaremos de autenticação, sincronização e regras de atendimento.</p><div class="row wrap"><button class="btn sm" data-action="ownernav" data-val="campaigns">Criar campanha</button><button class="btn teal sm" data-action="ownernav" data-val="packages">Gerenciar pacotes</button></div></div>'}
function ownerBookingRows(rows){return rows.length?rows.map(a=>'<div class="admin-row"><div><strong>'+clean(a.client)+' · '+clean(byService(a.service).title)+'</strong><p>'+shortDate(a.date)+' · '+a.time+' · '+a.status+'</p></div>'+(a.status==='confirmado'?'<button class="btn sm" data-action="complete" data-val="'+a.id+'">Concluir</button>':'<span class="pill teal">Concluído</span>')+'</div>').join(''):'<div class="empty">Sem agendamentos para mostrar.</div>'}
function ownerRequestRows(rows){return rows.length?rows.map(a=>'<div class="admin-row"><div><strong>'+clean(byService(a.service).title)+'</strong><p>'+clean(a.client)+' · '+a.status+' · '+shortDate(a.created)+'</p></div>'+(a.status==='nova'?'<button class="btn soft sm" data-action="review" data-val="'+a.id+'">Em contato</button>':'<span class="pill neutral">Em contato</span>')+'</div>').join(''):'<div class="empty">Nenhuma solicitação registrada.</div>'}
function ownerArea(){switch(ownerTab){
case 'agenda':return '<div class="owner-card"><h2>Agenda ilustrativa</h2><p class="small muted">Horários escolhidos no aplicativo aparecem aqui neste mesmo navegador. Não há conexão com o calendário real da clínica.</p>'+ownerBookingRows(state.appointments.slice().sort((a,b)=>a.date.localeCompare(b.date)))+'</div>';
case 'requests':return '<div class="owner-card"><h2>Interesse em avaliações</h2><p class="small muted">No site de demonstração, um clique em “solicitar avaliação” gera um registro fictício, sem informar dados pessoais nem enviar mensagens.</p>'+ownerRequestRows(state.requests.slice().reverse())+'</div>';
case 'packages':return '<div class="owner-card"><h2>Pacote de exemplo</h2><h3 class="serif" style="font-size:26px">'+clean(state.package.title)+'</h3><p class="small muted">Exclusivamente demonstrativo · '+state.package.done+' de '+state.package.total+' sessões concluídas</p><div class="progress"><span style="width:'+Math.min(100,100*state.package.done/state.package.total)+'%"></span></div><div class="row wrap" style="margin-top:20px"><button class="btn teal" data-action="package-next" '+(state.package.done>=state.package.total?'disabled':'')+'>Marcar próxima sessão concluída</button><button class="btn alt" data-action="view" data-val="app">Ver no app →</button></div><p class="notice mt">Na implantação, cada pacote precisa estar associado a uma cliente autenticada, com serviços, validade e sessões reais.</p></div>';
case 'campaigns':return '<div class="owner-columns"><div class="owner-card"><h2>Nova campanha de demonstração</h2><label class="field">Título<input id="camp-title" maxlength="60" placeholder="Ex.: Seu mês de autocuidado"></label><label class="field">Destaque<input id="camp-tag" maxlength="20" placeholder="Ex.: NOVIDADE"></label><label class="field">Mensagem<textarea id="camp-desc" maxlength="210" placeholder="Apresente a novidade sem prometer resultados."></textarea></label><button class="btn block" data-action="publish">Publicar somente na demonstração →</button><p class="small muted mt">Nenhuma mensagem é enviada para contatos reais.</p></div><div><div class="owner-card"><h2>Campanhas cadastradas</h2>'+state.campaigns.slice().reverse().map(c=>'<div class="admin-row"><div><strong>'+clean(c.title)+'</strong><p>'+clean(c.tag)+' · '+clean(c.desc)+'</p></div><button class="btn soft sm" data-action="campaign-toggle" data-val="'+c.id+'">'+(c.active?'Pausar':'Ativar')+'</button></div>').join('')+'</div></div></div>';
case 'loyalty':return '<div class="owner-columns"><div class="owner-card"><h2>Clube de benefícios</h2><p class="small muted">Valores e prêmios abaixo são exemplos de demonstração; não constituem uma oferta da clínica.</p><div class="row between"><div><span class="eyebrow">SALDO DEMONSTRATIVO</span><h3 class="serif" style="font-size:40px;margin:8px 0">'+state.points+' pontos</h3></div><span class="pill">Clube MC</span></div><div class="line"></div><p class="small muted">Na simulação: 30 pontos quando o proprietário conclui um atendimento. A política final será configurável e aprovada pela clínica.</p></div><div class="owner-card"><h2>Prêmios propostos</h2>'+rewards.map(r=>'<div class="admin-row"><div><strong>'+r.title+'</strong><p>'+r.points+' pontos · '+r.desc+'</p></div><span>'+r.emoji+'</span></div>').join('')+'</div></div>';
case 'finance':return '<div class="owner-card"><h2>Financeiro — estrutura planejada</h2><p class="small muted">O painel real terá agenda de recebimentos, pacotes, pagamentos confirmados e visão de receita, sem confundir reservas com vendas.</p><div class="notice">Não exibimos valores nem faturamento fictício como se fossem dados financeiros da clínica. Preços e regras comerciais ainda precisam ser confirmados.</div></div>';
default:return ownerHome()}}
function owner(){return '<div class="demo-app-outer"><div class="demo-guide">PAINEL DE DEMONSTRAÇÃO · SEM LOGIN · DADOS FICTÍCIOS · NÃO USAR PARA PACIENTES REAIS</div>'+switcher()+'<div class="owner-wrap"><aside class="owner-aside">'+logo()+'<nav aria-label="Módulos da gestão">'+ownerNav()+'</nav></aside><div><div class="owner-mobile-nav">'+ownerNav()+'</div><main class="owner-main"><div class="owner-toolbar"><div><span class="eyebrow">MOVE DIGITAL · PAINEL DA CLÍNICA</span><h1>'+({overview:'Sua clínica, mais organizada',agenda:'Agenda',requests:'Avaliações solicitadas',packages:'Pacotes e sessões',campaigns:'Campanhas',loyalty:'Clube de benefícios',finance:'Financeiro'}[ownerTab])+'</h1><p class="small muted">Gestão de exemplo para conhecer a futura operação.</p></div><button class="btn alt sm" data-action="view" data-val="app">Visão da cliente ↗</button></div>'+ownerArea()+'<p class="app-foot">Prévia Move Digital · Ações salvas localmente neste navegador.</p></main></div></div></div>'}
function render(){el('root').innerHTML=view==='site'?site():view==='app'?app():owner();document.title='Márcia Calixto · '+(view==='site'?'Site':view==='app'?'App cliente':'Painel de gestão')+' | Move Digital'}
function navigate(target){view=target;if(view==='app')appTab='home';if(view==='owner')ownerTab='overview';const url=new URL(location.href);url.searchParams.set('view',view);history.replaceState(null,'',url.pathname+url.search);render();window.scrollTo(0,0)}
function goApp(t){appTab=t;render();window.scrollTo(0,0)}
function showModal(title,body,buttons=''){modalOpen=true;el('modal-root').innerHTML='<div class="modal-overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="'+clean(title)+'"><span class="eyebrow">MÁRCIA CALIXTO · PRÉVIA</span><h2>'+clean(title)+'</h2>'+body+'<div class="modal-actions">'+buttons+'<button class="btn alt sm" data-action="close">Fechar</button></div></div></div>'}
function close(){modalOpen=false;el('modal-root').innerHTML=''}
function serviceModal(id){let s=byService(id),btn=s.mode==='book'?'<button class="btn sm" data-action="book-open" data-val="'+s.id+'">Simular horário →</button>':s.mode==='eval'?'<button class="btn sm" data-action="request" data-val="'+s.id+'">Simular pedido de avaliação →</button>':'';showModal(s.title,'<img style="width:100%;height:158px;object-fit:cover;border-radius:15px;margin-bottom:15px" src="'+photos[s.img]+'" alt="Imagem ilustrativa"><p>'+clean(s.description)+'</p><div class="notice">Informação em verificação. A indicação e eventual realização dependem da equipe habilitada. Valores e profissionais não foram confirmados.</div>',btn)}
function requestEval(id){let s=byService(id);if(s.mode==='info'){showModal('Serviço em validação','<p>As modalidades oferecidas e profissionais habilitados ainda não foram confirmados.</p>');return}state.requests.push({id:'rq-'+Date.now(),service:id,client:'Visitante de demonstração',status:'nova',created:isoDays(0)});save();showModal('Solicitação simulada registrada','<div class="success-mark">✓</div><p>Registramos localmente uma solicitação fictícia para <b>'+clean(s.title)+'</b>. Ela aparece no painel da gestão deste navegador.</p><div class="notice">Nenhuma solicitação foi recebida pela clínica. A versão final precisará de canal de contato confirmado e integração segura.</div>','<button class="btn teal sm" data-action="view" data-val="owner">Ver no painel →</button>')}
function toast(s){let old=el('modal-root').querySelector('.toast');if(old)old.remove();let div=document.createElement('div');div.className='toast';div.textContent=s;document.body.appendChild(div);setTimeout(()=>div.remove(),2600)}
function action(a,v){if(a==='view'){close();navigate(v);return}
if(a==='appnav'){goApp(v);return}
if(a==='ownernav'){ownerTab=v;render();return}
if(a==='menu'){menuOpen=!menuOpen;render();return}
if(a==='site-filter'){siteFilter=v;render();return}
if(a==='app-filter'){appFilter=v;render();return}
if(a==='detail'){serviceModal(v);return}
if(a==='request'){requestEval(v);return}
if(a==='book-open'){bookingService=v;bookingTime='';close();view='app';appTab='agenda';const url=new URL(location.href);url.searchParams.set('view','app');history.replaceState(null,'',url.pathname+url.search);render();return}
if(a==='close'){close();return}
if(a==='day'){bookingDate=v;bookingTime='';render();return}
if(a==='time'){bookingTime=v;render();return}
if(a==='weeknext'||a==='weekprev'){week=Math.max(0,Math.min(2,week+(a==='weeknext'?1:-1)));bookingDate=isoDays(1+week*7);bookingTime='';render();return}
if(a==='confirm-booking'){if(!bookingTime||!availableTimes().includes(bookingTime)){toast('Escolha um horário disponível na demonstração.');return}state.appointments.push({id:'app-'+Date.now(),service:bookingService,client:state.client,date:bookingDate,time:bookingTime,status:'confirmado',pointsGranted:false});state.messages.push({id:'nt-'+Date.now(),title:'Reserva demonstrativa registrada',body:byService(bookingService).title+' · '+shortDate(bookingDate)+' · '+bookingTime,read:false});save();bookingTime='';showModal('Agendamento demonstrativo criado','<div class="success-mark">✓</div><p>A reserva de exemplo foi adicionada à agenda. Você pode vê-la no aplicativo e no painel do proprietário neste navegador.</p><div class="notice">Não representa disponibilidade nem confirmação real da clínica.</div>','<button class="btn sm" data-action="view" data-val="owner">Ver no painel →</button>');return}
if(a==='complete'){let b=state.appointments.find(x=>x.id===v);if(b&&b.status==='confirmado'){b.status='concluido';if(!b.pointsGranted&&b.client===state.client){state.points+=30;state.earned+=30;b.pointsGranted=true;state.messages.push({id:'nt-'+Date.now(),title:'Você recebeu pontos!',body:'+30 pontos no Clube MC pela visita demonstrativa.',read:false})}save();render()}return}
if(a==='review'){let b=state.requests.find(x=>x.id===v);if(b){b.status='em contato';save();render()}return}
if(a==='package-next'){if(state.package.done<state.package.total){state.package.done++;save();render();toast('Sessão fictícia marcada como concluída.')}return}
if(a==='publish'){let title=el('camp-title')?.value.trim(),tag=el('camp-tag')?.value.trim(),desc=el('camp-desc')?.value.trim();if(!title||!tag||!desc){toast('Preencha título, destaque e mensagem.');return}state.campaigns.push({id:'cp-'+Date.now(),title:title.slice(0,60),tag:tag.slice(0,20),desc:desc.slice(0,210),active:true});state.messages.push({id:'nt-'+Date.now(),title:title.slice(0,60),body:desc.slice(0,210),read:false});save();render();toast('Campanha salva somente no demo.');return}
if(a==='campaign-toggle'){let c=state.campaigns.find(x=>x.id===v);if(c){c.active=!c.active;save();render()}return}
if(a==='inbox'){const list=state.messages.slice(-5).reverse().map(m=>'<div class="app-card"><strong>'+clean(m.title)+'</strong><p class="small muted" style="margin:6px 0 0">'+clean(m.body)+'</p></div>').join('');state.messages.forEach(x=>x.read=true);save();showModal('Suas novidades',list||'<p>Nenhuma notificação na demonstração.</p>');return}
if(a==='notification-toggle'){state.settings.notifications=!state.settings.notifications;save();render();return}
if(a==='redeem'){let r=rewards.find(x=>x.id===v);if(!r||state.points<r.points)return;state.points-=r.points;state.coupons.push({id:'cp-'+Date.now(),title:r.title,code:'MC-DEMO-'+String(Date.now()).slice(-5)});save();showModal('Resgate demonstrativo concluído','<div class="success-mark">✓</div><p>Um cupom fictício foi criado no seu Perfil. O benefício não tem valor comercial e depende da aprovação das regras reais.</p>','<button class="btn sm" data-action="go-profile">Ver meu perfil</button>');return}
if(a==='reward-info'){let r=rewards.find(x=>x.id===v);if(r)showModal('Continue conquistando pontos','<p>Faltam <b>'+(r.points-state.points)+' pontos</b> para essa recompensa fictícia. O programa real ainda será definido pela clínica.</p>','<button class="btn sm" data-action="go-agenda">Ver agenda</button>');return}
if(a==='go-profile'){close();goApp('profile');return}
if(a==='go-agenda'){close();goApp('agenda');return}}
