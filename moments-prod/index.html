<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moments Paris | Produção</title><style>
:root{font-family:system-ui,-apple-system,Arial;color:#f6eee0;background:#10100f}*{box-sizing:border-box}body{margin:0}header{background:#070707;border-bottom:1px solid #80693e;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}h1{font-family:Georgia,serif;color:#d9b97b;font-size:25px;margin:0}main{max-width:1100px;margin:auto;padding:24px 5%}h2{font-size:19px;color:#e2c792}h3{font-size:16px}section{background:#1c1b19;border:1px solid #484031;border-radius:14px;padding:20px;margin:16px 0}input,select,button,textarea{font:inherit;padding:12px;border-radius:9px;border:1px solid #655942;max-width:100%}input,select,textarea{background:#272522;color:white}button{background:#caa568;color:#17130d;font-weight:700;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:transparent;color:#e2c792}form{display:flex;gap:10px;flex-wrap:wrap;align-items:center}label{display:grid;gap:6px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 7px;border-bottom:1px solid #474137;text-align:left}small,.muted{color:#b6ad9d}.error{color:#ffb5a9}.ok{color:#b5e5bd}.hide{display:none}.scroll{overflow:auto}#notice{min-height:24px}a{color:#e2c792}</style></head><body><header><h1>MOMENTS PARIS</h1><button id="logout" class="secondary hide">Sair</button></header><main><p id="notice" aria-live="polite"></p><section id="login"><h2>Acesso seguro</h2><p class="muted">Ambiente de produção. Entre com sua conta autorizada.</p><form id="loginForm"><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button>Entrar</button></form></section><div id="dashboard" class="hide"><h2 id="welcome"></h2><section><h3>Catálogo</h3><div id="products" class="scroll"></div></section><section id="orderSection"><h3>Solicitar produtos à franquia</h3><form id="orderForm"><label>Produto<select id="orderProduct" required></select></label><label>Quantidade<input id="orderQty" type="number" min="1" max="999" value="1" required></label><button>Enviar para aprovação</button></form></section><section><h3>Pedidos</h3><div id="orders" class="scroll"></div></section><section id="inventorySection"><h3>Meu estoque</h3><div id="inventory" class="scroll"></div><h3>Registrar venda</h3><form id="saleForm"><label>Produto<select id="saleProduct" required></select></label><label>Quantidade<input id="saleQty" type="number" min="1" max="999" value="1" required></label><button>Registrar venda</button></form></section><section id="financeSection"><h3>Financeiro</h3><div id="finance"></div></section><section><h3>Campanhas</h3><div id="campaigns"></div></section><section><h3>Assinatura</h3><div id="subscription"></div></section></div></main>
<script type="module">
import{createClient}from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const sb=createClient('https://jpnuezounmnnnnztocxn.supabase.co','sb_publishable_yrujwXvWHWPCFyjqia9kgA_MXcbsH0D',{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(Number(n||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let me=null,products=[],inventory=[];
function notice(s,error=false){$('notice').textContent=s;$('notice').className=error?'error':'ok'}
async function data(table,cols='*',order=null){let q=sb.from(table).select(cols);if(order)q=q.order(order,{ascending:false});const{data,error}=await q;if(error)throw error;return data||[]}
function table(rows,cols){return rows.length?'<table><thead><tr>'+cols.map(c=>'<th>'+esc(c[0])+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+c[1](r)+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<p class="muted">Nenhum registro encontrado.</p>'}
function opts(rows){return rows.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('')}
async function refresh(){const{data:{user}}=await sb.auth.getUser();if(!user){me=null;$('login').classList.remove('hide');$('dashboard').classList.add('hide');$('logout').classList.add('hide');return}
const{data:m,error}=await sb.from('memberships').select('*').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!m||!m.active){await sb.auth.signOut();notice('Conta ainda não habilitada. Solicite liberação à administração.',true);return}
me=m;$('login').classList.add('hide');$('dashboard').classList.remove('hide');$('logout').classList.remove('hide');$('welcome').textContent='Olá, '+m.display_name+' — '+(m.role==='reseller'?'Revendedor':m.role==='franchise_admin'?'Franquia':'Administração');
const admin=m.role!=='reseller';$('orderSection').classList.toggle('hide',admin);$('inventorySection').classList.toggle('hide',admin);$('financeSection').classList.toggle('hide',admin);
products=await data('products','id,name,cost_cents,retail_cents,active');products=products.filter(x=>x.active);
$('products').innerHTML=table(products,[['Produto',r=>esc(r.name)],['Custo',r=>money(r.cost_cents)],['Venda',r=>money(r.retail_cents)]]);
$('orderProduct').innerHTML=opts(products);$('saleProduct').innerHTML=opts(products);
const orders=await data('orders','id,status,reseller_id,created_at','created_at');$('orders').innerHTML=table(orders,[['Pedido',r=>esc(r.id.slice(0,8))],['Data',r=>new Date(r.created_at).toLocaleString('pt-BR')],['Status',r=>esc(r.status)],['Ação',r=>{let next=admin?({pending:'approved',approved:'ready'}[r.status]):({ready:'received'}[r.status]);return next?'<button data-order="'+esc(r.id)+'" data-status="'+next+'">'+({approved:'Aprovar',ready:'Liberar retirada',received:'Confirmar recebimento'}[next])+'</button>':'—'}]]);
$('orders').querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>transition(b.dataset.order,b.dataset.status));
const campaigns=await data('campaigns','title,body');$('campaigns').innerHTML=campaigns.length?campaigns.map(x=>'<p><strong>'+esc(x.title)+'</strong><br>'+esc(x.body)+'</p>').join(''):'<p class="muted">Nenhuma campanha ativa.</p>';
if(!admin){inventory=await data('inventory','product_id,quantity');$('inventory').innerHTML=table(inventory,[['Produto',r=>esc(products.find(p=>p.id===r.product_id)?.name||r.product_id)],['Quantidade',r=>esc(r.quantity)]]);
const sales=await data('sales','total_cents,profit_cents,sold_at');$('finance').textContent='Vendas: '+money(sales.reduce((a,s)=>a+s.total_cents,0))+' | Lucro bruto: '+money(sales.reduce((a,s)=>a+s.profit_cents,0));
const sub=await sb.from('subscriptions').select('status,current_period_end').eq('reseller_id',user.id).maybeSingle();if(sub.error)throw sub.error;$('subscription').textContent=sub.data?'Situação: '+sub.data.status:'Sem assinatura ativa';}else $('subscription').textContent='Gestão de assinaturas disponível somente no painel administrativo de cobrança.';
}
async function transition(id,status){if(!confirm('Confirmar alteração para '+status+'?'))return;try{const{error}=await sb.rpc('transition_order',{p_order:id,p_status:status});if(error)throw error;notice('Pedido atualizado.');await refresh()}catch(e){notice(e.message,true)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const{error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;notice('Login realizado.');await refresh()}catch(e){notice(e.message,true)}};
$('logout').onclick=async()=>{await sb.auth.signOut();await refresh()};
$('orderForm').onsubmit=async e=>{e.preventDefault();try{const{error}=await sb.rpc('place_order',{p_items:[{product_id:$('orderProduct').value,quantity:Number($('orderQty').value)}]});if(error)throw error;notice('Pedido enviado para aprovação.');await refresh()}catch(e){notice(e.message,true)}};
$('saleForm').onsubmit=async e=>{e.preventDefault();try{const{error}=await sb.rpc('record_sale',{p_items:[{product_id:$('saleProduct').value,quantity:Number($('saleQty').value)}]});if(error)throw error;notice('Venda registrada e estoque atualizado.');await refresh()}catch(e){notice(e.message,true)}};
refresh().catch(e=>notice(e.message,true));
</script></body></html>
