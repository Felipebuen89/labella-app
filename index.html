<style>

.top{display:flex;align-items:center;justify-content:space-between;margin:3px 0 26px;gap:12px}.logo{display:flex;gap:11px;align-items:center;font-weight:850;font-size:22px;letter-spacing:-.8px}.mark{height:40px;width:40px;border-radius:13px;background:var(--lime);color:var(--black);display:grid;place-items:center;font-size:23px}.top-date{font-size:12px;color:var(--muted);text-align:right;line-height:1.5}
.eyebrow{font-size:11px;color:var(--lime);letter-spacing:2px;text-transform:uppercase;font-weight:800}.hello{font-size:33px;letter-spacing:-1.5px;line-height:1.12;margin:9px 0 7px;font-weight:850}.sub{color:var(--muted);margin:0 0 22px;font-size:14px;line-height:1.6}
.hero{border-radius:26px;padding:25px;background:radial-gradient(ellipse at 100% 0%,#46602d 0%,#243325 35%,#1c241e 65%,#171c18 100%);border:1px solid #455b41;overflow:hidden;position:relative;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;right:-65px;top:-75px;width:220px;height:220px;border:29px solid #c4f26b10;border-radius:50%;pointer-events:none}.hero h2{font-size:25px;letter-spacing:-.8px;margin:11px 0 6px;line-height:1.2;max-width:75%}.hero p{color:#b8c5b6;font-size:13px;margin:0 0 22px;max-width:72%;line-height:1.5}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 20px}.chip{border-radius:100px;background:#e0ff9b18;color:#e2fbb6;border:1px solid #9eca724d;padding:6px 10px;font-size:11px;font-weight:700}.row{display:flex;align-items:center;gap:10px}.spread{justify-content:space-between}.btn{border:0;border-radius:13px;padding:13px 17px;font-size:13px;font-weight:850;background:var(--lime);color:var(--black);transition:transform .15s,filter .15s}.btn:active{transform:scale(.97)}.btn:hover{filter:brightness(1.04)}.btn.outline{background:transparent;border:1px solid #6d8b5f;color:#e7f7d5}.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}.btn.small{padding:8px 11px;border-radius:9px;font-size:12px}.btn.full{width:100%}.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:16px 0 26px}.stat{background:var(--surface);border:1px solid var(--line);padding:16px 12px;border-radius:18px;min-width:0}.stat strong{display:block;font-size:23px;letter-spacing:-1px;line-height:1.35}.stat span{color:var(--muted);font-size:11px;line-height:1.4;display:block}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:27px 0 13px}.sectionhead h3{margin:0;font-size:18px;letter-spacing:-.5px}.link{border:0;background:none;color:var(--lime);font-weight:800;font-size:12px;padding:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.workday{display:flex;gap:13px;align-items:center}.daynum{background:#c4f26b17;color:var(--lime);border-radius:13px;min-width:46px;height:46px;display:grid;place-items:center;font-weight:900;font-size:18px}.workday strong{font-size:15px}.workday p{margin:5px 0 0;color:var(--muted);font-size:12px}.muted{color:var(--muted)}.mini{font-size:12px}.divider{height:1px;background:var(--line);margin:15px 0}.exercise{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border-bottom:none}.exicon{width:40px;height:40px;background:#303b30;border-radius:12px;display:grid;place-items:center;font-size:19px;flex-shrink:0}.exmain{flex:1;min-width:0}.exmain strong{font-size:13px;display:block;line-height:1.4}.exmain small{font-size:11px;color:var(--muted);line-height:1.5}.tag{color:var(--lime);font-size:11px;font-weight:750;white-space:nowrap}.empty{padding:24px;text-align:center;color:var(--muted);background:var(--surface);border-radius:18px;border:1px dashed var(--line);line-height:1.7}
.nav{position:fixed;bottom:0;left:0;right:0;background:#161c17ec;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid #3b453a;display:flex;justify-content:space-around;gap:4px;padding:12px max(12px,calc((100vw - 780px)/2 + 15px)) calc(12px + env(safe-area-inset-bottom));z-index:10}
.nav button{border:0;color:#98a795;background:none;display:grid;gap:4px;justify-items:center;min-width:60px;font-size:10px;font-weight:700;padding:4px}.nav button.active{color:var(--lime)}.nav .ico{font-size:21px;line-height:1.2}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:7px;min-width:0}.field label{color:#bfccbb;font-size:11px;font-weight:750;letter-spacing:.2px}.field input,.field select,.search{background:#121712;border:1px solid #435044;border-radius:11px;color:#f9faf8;padding:12px;width:100%;min-width:0;font-size:14px}.field input[type=number]{font-variant-numeric:tabular-nums}.field select{appearance:auto}.formwide{grid-column:1/-1}.notice{background:#203020;border:1px solid #425e3d;border-radius:14px;padding:14px;font-size:12px;color:#d3e9c9;line-height:1.55}.warn{color:#eadbaa;background:#3c3623;border-color:#645a34}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 18px}.pill{border:1px solid #414d41;background:#212a22;color:#c8d4c5;border-radius:100px;padding:8px 13px;font-size:12px}.pill.sel{background:var(--lime);border-color:var(--lime);color:#152010;font-weight:850}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.history{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:13px 0;gap:7px}.history:last-child{border:0}
.barrow{display:flex;align-items:end;justify-content:space-between;gap:9px;height:125px;padding-top:20px}.barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:7px;height:100%}.bar{background:#465746;border-radius:7px 7px 3px 3px;width:100%;max-width:35px;min-height:5px}.bar.on{background:linear-gradient(180deg,var(--lime),#6a993d)}.barcol span{color:#95a595;font-size:10px}
.overlay{position:fixed;inset:0;background:#000b;z-index:30;display:flex;align-items:end;justify-content:center}.sheet{max-width:650px;width:100%;max-height:91dvh;overflow:auto;background:#1b241d;border-radius:25px 25px 0 0;padding:26px 20px calc(25px + env(safe-area-inset-bottom));border:1px solid #53654e;box-shadow:0 -12px 65px #0009}.sheet h2{font-size:23px;margin:3px 0 8px}.sheet .sub{margin-bottom:20px}
.tick{width:24px;height:24px;accent-color:var(--lime)}.sessionrow{border:1px solid var(--line);background:#19211a;border-radius:15px;padding:15px;margin-bottom:10px}.sessionrow.done{border-color:#6a8e50;background:#20301f}.sessionrow h4{margin:0 0 4px;font-size:14px}.sessionrow .formgrid{grid-template-columns:repeat(3,1fr);margin-top:12px}.sessionrow .field input{padding:9px}.timer{font-variant-numeric:tabular-nums;color:var(--lime);font-size:19px;font-weight:900}
@media(min-width:650px){.app{padding-top:32px}.hello{font-size:40px}.hero{padding:34px}.hero h2{font-size:30px}.grid2{grid-template-columns:repeat(2,1fr)}}@media(max-width:360px){.formgrid{grid-template-columns:1fr}.formwide{grid-column:auto}.hero h2,.hero p{max-width:100%}.stat strong{font-size:18px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="logo"><span class="mark">🏋</span><span>Treino<span style="color:var(--lime)">Lab</span></span></div><span class="top-date" id="dateLabel"></span></header>
<main id="main" aria-live="polite"></main>
</div>
<nav class="nav" aria-label="Navegação principal" id="nav">
<button data-tab="home" class="active"><span class="ico">⌂</span>Início</button>
<button data-tab="plan"><span class="ico">▦</span>Meus treinos</button>
<button data-tab="library"><span class="ico">⌕</span>Exercícios</button>
<button data-tab="progress"><span class="ico">↗</span>Evolução</button>
</nav>
<div id="modal"></div>
<script>
(function(){
'use strict';
var KEY='treinolab-v1', state,tab='home',modal=null,expanded=-1,filter='Todos',term='',selectedDay=0,timerLeft=0,timerHandle=null;
var D=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
var DB=[
['Supino reto com barra','Peito','academia','🏋','Mantenha os pés apoiados e controle a descida.'],
['Supino inclinado com halteres','Peito','academia','🏋','Evite arquear excessivamente a lombar.'],
['Crucifixo na máquina','Peito','academia','💪','Movimento lento e confortável.'],
['Flexão de braços','Peito','casa','💪','Adapte apoiando os joelhos quando necessário.'],
['Flexão inclinada','Peito','casa','💪','Apoie as mãos numa superfície firme.'],
['Remada baixa','Costas','academia','🏋','Puxe com cotovelos e sem balançar o tronco.'],
['Puxada na frente','Costas','academia','🏋','Traga a barra até a região superior do peito.'],
['Remada curvada com halteres','Costas','academia','💪','Mantenha a coluna neutra.'],
['Remada com mochila','Costas','casa','🎒','Use mochila firme com peso seguro.'],
['Superman no solo','Costas','casa','🧘','Eleve suavemente braços e pernas.'],
['Agachamento livre','Pernas','ambos','🦵','Desça até a amplitude confortável.'],
['Leg press','Pernas','academia','🦵','Não estenda os joelhos com travamento.'],
['Cadeira extensora','Pernas','academia','🦵','Faça a fase de descida controlada.'],
['Mesa flexora','Pernas','academia','🦵','Não tire o quadril do banco.'],
['Afundo alternado','Pernas','ambos','🦵','Mantenha equilíbrio e controle.'],
['Elevação de panturrilha','Pernas','ambos','🦵','Pause um instante na subida.'],
['Agachamento sumô','Pernas','ambos','🦵','Mantenha os joelhos alinhados aos pés.'],
['Desenvolvimento com halteres','Ombros','academia','💪','Evite compensar com a lombar.'],
['Elevação lateral','Ombros','academia','💪','Use carga que permita controlar o gesto.'],
['Pike push-up','Ombros','casa','💪','Faça na amplitude em que tiver controle.'],
['Elevação frontal com garrafas','Ombros','casa','💧','Use garrafas bem fechadas.'],
['Rosca direta','Bíceps','academia','💪','Evite movimentar o tronco.'],
['Rosca martelo','Bíceps','academia','💪','Mantenha os cotovelos próximos do corpo.'],
['Rosca com mochila','Bíceps','casa','🎒','Use carga leve inicialmente.'],
['Tríceps na polia','Tríceps','academia','💪','Mantenha os cotovelos estáveis.'],
['Tríceps francês','Tríceps','academia','💪','Não force a amplitude dos ombros.'],
['Tríceps na parede','Tríceps','casa','💪','Flexione cotovelos em apoio firme na parede.'],
['Ponte de glúteos','Glúteos','ambos','🦵','Contraia os glúteos no topo.'],
['Elevação pélvica','Glúteos','academia','🦵','Use carga e amplitude confortáveis.'],
['Abdução de quadril em pé','Glúteos','casa','🦵','Use apoio estável e evite girar o tronco.'],
['Prancha','Core','ambos','🧘','Mantenha abdômen firme e respiração fluindo.'],
['Abdominal curto','Core','ambos','🧘','Não puxe o pescoço.'],
['Dead bug','Core','ambos','🧘','Mova braços e pernas sem arquear a lombar.'],
['Bicicleta ergométrica','Cardio','academia','🚲','Ajuste a intensidade à sua capacidade.'],
['Caminhada rápida','Cardio','ambos','🚶','Mantenha ritmo em que consiga conversar.'],
['Polichinelo adaptado','Cardio','casa','⚡','Faça sem saltos se necessário.'],
['Subida em degrau baixo','Cardio','casa','🪜','Use degrau firme e apoios seguros.'],
['Esteira','Cardio','academia','🏃','Comece em ritmo leve.'],
['Remada unilateral','Costas','academia','🏋','Apoie o corpo para proteger a postura.'],
['Flexão fechada','Tríceps','casa','💪','Comece com mãos elevadas se necessário.']
].map(function(a,i){return {id:i,n:a[0],g:a[1],e:a[2],ico:a[3],tip:a[4]};});
function safe(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function today(d){var x=d||new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function fmtDate(str){var a=String(str).split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:str;}
function get(i){return DB.find(function(x){return x.id===+i;});}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){alert('Não foi possível salvar neste navegador. Verifique o armazenamento disponível.');}}
function planFor(goal,level,days,equip){
var sets=level==='Iniciante'?2:level==='Avançado'?4:3;
var variants={
2:[['Superior','Peito','Costas','Ombros','Bíceps','Tríceps','Core'],['Inferior','Pernas','Glúteos','Pernas','Core','Cardio']],
3:[['A · Empurrar','Peito','Ombros','Tríceps','Core'],['B · Puxar','Costas','Bíceps','Core','Cardio'],['C · Pernas','Pernas','Glúteos','Pernas','Core']],
4:[['A · Superior','Peito','Costas','Ombros','Bíceps'],['B · Inferior','Pernas','Glúteos','Pernas','Core'],['C · Superior','Costas','Peito','Tríceps','Ombros'],['D · Inferior','Pernas','Glúteos','Pernas','Cardio']],
5:[['A · Peito e tríceps','Peito','Peito','Tríceps','Core'],['B · Costas e bíceps','Costas','Costas','Bíceps','Core'],['C · Pernas','Pernas','Glúteos','Pernas','Core'],['D · Ombros e peito','Ombros','Peito','Tríceps','Cardio'],['E · Posterior e costas','Pernas','Glúteos','Costas','Core']],
6:[['A · Empurrar','Peito','Ombros','Tríceps'],['B · Puxar','Costas','Bíceps','Core'],['C · Pernas','Pernas','Glúteos','Core'],['D · Empurrar','Peito','Ombros','Tríceps'],['E · Puxar','Costas','Bíceps','Core'],['F · Pernas','Pernas','Glúteos','Core']]
};
return variants[days].map(function(v,idx){
var used=[], groups=v.slice(1);
if(goal==='Condicionamento' && groups.indexOf('Cardio')<0)groups.push('Cardio');
if(goal==='Emagrecimento' && groups.indexOf('Cardio')<0)groups.push('Cardio');
var ex=groups.map(function(group,j){
var pool=DB.filter(function(x){return x.g===group&&(x.e===equip||x.e==='ambos');});
if(!pool.length)pool=DB.filter(function(x){return x.g===group;});
var pos=(idx+j)%pool.length,x=pool[pos],tries=0;
while(used.indexOf(x.id)>=0 && tries<pool.length){pos=(pos+1)%pool.length;x=pool[pos];tries++;}
used.push(x.id);
return {id:x.id,sets:group==='Cardio'?1:sets,reps:group==='Cardio'?'15 min':group==='Core'?'30 s':goal==='Força'?'6-8':'10-12',rest:group==='Cardio'?0:group==='Core'?45:90,weight:''};
});
return {name:'Treino '+v[0],ex:ex};
});
}
function load(){
try{var raw=JSON.parse(localStorage.getItem(KEY));if(raw&&Array.isArray(raw.days)&&Array.isArray(raw.sessions)&&raw.settings){state=raw;return;}}catch(e){}
state={settings:{goal:'Hipertrofia',level:'Iniciante',days:3,equip:'academia'},days:planFor('Hipertrofia','Iniciante',3,'academia'),sessions:[],created:today()};
save();
}
function num(n){return new Intl.NumberFormat('pt-BR').format(n);}
function weekStats(){
var now=new Date(),w=[];
for(var i=6;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i),key=today(d);w.push({date:key,name:D[d.getDay()],count:state.sessions.filter(function(s){return s.date===key;}).length});}
return w;
}
function currentIdx(){return ((new Date().getDay()+6)%7)%state.days.length;}
function btn(text,action,cls,attr){return '<button class="btn '+(cls||'')+'" data-action="'+action+'" '+(attr||'')+'>'+text+'</button>';}
function top(title,subtitle){return '<span class="eyebrow">TreinoLab</span><h1 class="hello">'+title+'</h1><p class="sub">'+subtitle+'</p>';}
function stats(){
var w=weekStats(),count=w.reduce(function(a,b){return a+b.count;},0);
var total=state.sessions.length;
var volume=state.sessions.reduce(function(s,x){return s+(x.volume||0);},0);
return '<div class="statgrid"><div class="stat"><strong>'+count+'</strong><span>Treinos / 7 dias</span></div><div class="stat"><strong>'+total+'</strong><span>Treinos feitos</span></div><div class="stat"><strong>'+num(Math.round(volume))+'</strong><span>Volume registrado (kg)</span></div></div>';
}
function cardDay(d,i,compact){
return '<div class="panel"><div class="workday"><div class="daynum">'+String(i+1).padStart(2,'0')+'</div><div style="flex:1;min-width:0"><strong>'+safe(d.name)+'</strong><p>'+d.ex.length+' exercícios • '+(d.ex.length*7)+'–'+(d.ex.length*10)+' min estimados</p></div>'+btn('Iniciar','start','small','data-idx="'+i+'"')+'</div>'+
(compact?'':'<div class="divider"></div>'+d.ex.map(function(ex,j){var x=get(ex.id);return x?'<div class="exercise"><span class="exicon">'+x.ico+'</span><div class="exmain"><strong>'+safe(x.n)+'</strong><small>'+safe(ex.sets)+' séries × '+safe(ex.reps)+' • '+safe(x.g)+'</small></div>'+(expanded===i?'<button class="btn ghost small" data-action="remove" data-idx="'+i+'" data-ex="'+j+'" aria-label="Remover exercício">×</button>':'')+'</div>':'';}).join('')+
'<div class="row" style="margin-top:14px;justify-content:space-between;flex-wrap:wrap">'+btn(expanded===i?'Concluir edição':'Editar treino','expand','small ghost','data-idx="'+i+'"')+btn('Adicionar exercício','addFromDay','small outline','data-idx="'+i+'"')+'</div>'+
(expanded===i?'<div class="divider"></div><div class="field"><label>Nome do treino</label><input data-day-name="'+i+'" maxlength="55" value="'+safe(d.name)+'"></div><p class="muted mini">Ajuste séries, repetições e descanso abaixo:</p>'+d.ex.map(function(ex,j){var x=get(ex.id);return '<div class="panel" style="padding:11px"><strong class="mini">'+safe(x?x.n:'Exercício')+'</strong><div class="formgrid" style="margin-top:10px"><div class="field"><label>Séries</label><input type="number" min="1" max="12" value="'+safe(ex.sets)+'" data-edit="sets" data-idx="'+i+'" data-ex="'+j+'"></div><div class="field"><label>Repetições ou tempo</label><input value="'+safe(ex.reps)+'" maxlength="20" data-edit="reps" data-idx="'+i+'" data-ex="'+j+'"></div><div class="field"><label>Descanso (seg)</label><input type="number" min="0" max="900" value="'+safe(ex.rest)+'" data-edit="rest" data-idx="'+i+'" data-ex="'+j+'"></div></div></div>';}).join(''):'') )+'</div>';
}
function home(){
var s=state.settings,i=currentIdx(),d=state.days[i],w=weekStats(),done=w.reduce(function(a,x){return a+x.count;},0);
return top('Seu ritmo. Sua evolução.','Seu espaço para montar treinos, registrar cada série e acompanhar resultados reais.')+
'<section class="hero"><span class="eyebrow">Seu próximo treino</span><h2>'+safe(d.name)+'</h2><p>'+d.ex.length+' exercícios preparados para você. Um passo de cada vez.</p><div class="chips"><span class="chip">'+safe(s.goal)+'</span><span class="chip">'+safe(s.level)+'</span><span class="chip">'+safe(s.equip==='casa'?'Em casa':'Academia')+'</span></div>'+btn('▶ Começar treino','start','','data-idx="'+i+'"')+'</section>'+
stats()+'<div class="sectionhead"><h3>Sua semana</h3><button class="link" data-tab="progress">Ver evolução →</button></div><div class="panel"><div class="row spread"><div><strong>'+done+' de '+s.days+' treinos</strong><p class="muted mini" style="margin-bottom:0">Meta semanal indicativa</p></div><strong style="color:var(--lime);font-size:25px">'+Math.min(100,Math.round(done/s.days*100))+'%</strong></div><div style="height:9px;background:#344135;border-radius:30px;margin-top:15px;overflow:hidden"><div style="width:'+Math.min(100,done/s.days*100)+'%;height:100%;background:var(--lime);border-radius:30px"></div></div></div>'+
'<div class="sectionhead"><h3>Próximos treinos</h3><button class="link" data-tab="plan">Todos →</button></div>'+state.days.slice(0,3).map(function(d,j){return cardDay(d,j,true);}).join('')+
'<p class="notice">Dica: comece com cargas confortáveis e ajuste o treino à sua realidade. Este app não substitui orientação de um profissional de educação física ou de saúde.</p>';
}
function plan(){
return top('Meus treinos','Sua divisão semanal, do seu jeito. Monte um novo plano ou ajuste os exercícios individualmente.')+
'<div class="panel"><div class="row spread" style="flex-wrap:wrap"><div><strong>'+safe(state.settings.days)+' dias por semana</strong><p class="muted mini" style="margin:6px 0 0">'+safe(state.settings.goal)+' · '+safe(state.settings.level)+'</p></div>'+btn('⚙ Montar plano','builder','small')+'</div></div>'+
state.days.map(function(d,i){return cardDay(d,i,false);}).join('')+
'<div class="notice">O plano é uma sugestão inicial, não uma prescrição individual. Você pode editar nomes, séries, repetições e exercícios.</div>';
}
function exList(){
var results=DB.filter(function(x){return (filter==='Todos'||x.g===filter)&&(state.settings.equip==='academia'||x.e!=='academia')&&x.n.toLowerCase().includes(term.toLowerCase());});
return '<div class="muted mini" style="margin:0 0 8px">'+results.length+' exercícios encontrados</div>'+results.map(function(x){
return '<div class="exercise"><span class="exicon">'+x.ico+'</span><div class="exmain"><strong>'+safe(x.n)+'</strong><small>'+safe(x.g)+' · '+safe(x.e==='ambos'?'Casa e academia':x.e==='casa'?'Casa':'Academia')+'</small></div><button class="btn small ghost" data-action="details" data-id="'+x.id+'">Ver</button><button class="btn small" data-action="add" data-id="'+x.id+'">+</button></div>';
}).join('')||'<div class="empty">Nenhum exercício encontrado. Tente outro filtro.</div>';
}
function library(){
var cats=['Todos','Peito','Costas','Pernas','Glúteos','Ombros','Bíceps','Tríceps','Core','Cardio'];
return top('Biblioteca de exercícios','Explore os movimentos e adicione-os diretamente ao seu plano.')+
'<div class="panel"><div class="formgrid"><div class="field formwide"><label>Adicionar exercícios ao treino</label><select id="selectedDay">'+state.days.map(function(d,i){return '<option value="'+i+'" '+(i===selectedDay?'selected':'')+'>'+safe(d.name)+'</option>';}).join('')+'</select></div></div></div>'+
'<input class="search" id="search" placeholder="⌕ Buscar exercício..." value="'+safe(term)+'" aria-label="Buscar exercícios">'+
'<div class="pills">'+cats.map(function(c){return '<button class="pill '+(filter===c?'sel':'')+'" data-action="filter" data-filter="'+c+'">'+c+'</button>';}).join('')+'</div><div id="libResults" class="panel">'+exList()+'</div>';
}
function progress(){
var w=weekStats(),max=Math.max(1,...w.map(function(x){return x.count;}));
var sessions=state.sessions.slice().reverse().slice(0,20);
return top('Sua evolução','Constância primeiro. Acompanhe o que você realmente concluiu.')+
stats()+'<div class="sectionhead"><h3>Últimos 7 dias</h3></div><div class="panel"><div class="barrow">'+w.map(function(x){return '<div class="barcol"><div title="'+x.count+' treino(s)" class="bar '+(x.count?'on':'')+'" style="height:'+Math.max(5,x.count/max*80)+'px"></div><span>'+x.name+'</span></div>';}).join('')+'</div></div>'+
'<div class="sectionhead"><h3>Histórico</h3></div><div class="panel">'+(sessions.length?sessions.map(function(x){return '<div class="history"><div><strong class="mini">'+safe(x.name)+'</strong><div class="muted mini">'+fmtDate(x.date)+' · '+x.done+' exercícios · '+(x.minutes||0)+' min</div></div><strong class="tag">'+num(Math.round(x.volume||0))+' kg</strong></div>';}).join(''):'<div class="empty">Conclua seu primeiro treino para começar seu histórico.</div>')+'</div>'+
'<div class="sectionhead"><h3>Seus dados</h3></div><div class="panel"><div class="grid2">'+btn('↓ Exportar backup','export','ghost')+btn('↑ Importar backup','import','ghost')+'</div><p class="muted mini">Tudo fica salvo apenas neste navegador. Exporte para não perder seus treinos ao trocar de celular ou limpar os dados do site.</p><input type="file" id="importFile" accept=".json,application/json" style="display:none"></div>';
}
function builder(){
var s=state.settings;
return '<div class="overlay" role="presentation"><div class="sheet" role="dialog" aria-modal="true" aria-label="Montar plano de treino"><div class="row spread"><span class="eyebrow">Seu treino, suas regras</span><button class="btn small ghost" data-action="close">Fechar ×</button></div><h2>Monte seu plano</h2><p class="sub">Escolha seu objetivo e receba uma divisão editável. O plano atual será substituído, mas o histórico permanece.</p><form id="builderForm" class="formgrid"><div class="field formwide"><label for="goal">Objetivo</label><select id="goal"><option '+(s.goal==='Hipertrofia'?'selected':'')+'>Hipertrofia</option><option '+(s.goal==='Emagrecimento'?'selected':'')+'>Emagrecimento</option><option '+(s.goal==='Condicionamento'?'selected':'')+'>Condicionamento</option><option '+(s.goal==='Força'?'selected':'')+'>Força</option></select></div><div class="field"><label for="level">Nível</label><select id="level"><option '+(s.level==='Iniciante'?'selected':'')+'>Iniciante</option><option '+(s.level==='Intermediário'?'selected':'')+'>Intermediário</option><option '+(s.level==='Avançado'?'selected':'')+'>Avançado</option></select></div><div class="field"><label for="days">Dias por semana</label><select id="days">'+[2,3,4,5,6].map(function(x){return '<option value="'+x+'" '+(s.days===x?'selected':'')+'>'+x+' dias</option>';}).join('')+'</select></div><div class="field formwide"><label for="equip">Local dos exercícios</label><select id="equip"><option value="academia" '+(s.equip==='academia'?'selected':'')+'>Academia</option><option value="casa" '+(s.equip==='casa'?'selected':'')+'>Em casa, sem aparelhos de academia</option></select></div><div class="formwide notice warn">Atenção: exercícios e divisões são sugestões genéricas. Respeite limitações, recuperação e orientação profissional, especialmente em caso de lesão ou condição clínica.</div><button class="btn full formwide" type="submit">Gerar meu plano →</button></form></div></div>';
}
function session(){
var s=state.active;if(!s)return '';
var d=state.days[s.day];if(!d){state.active=null;save();return '';}
var entries=s.entries||[],done=entries.filter(function(e){return e.done;}).length;
return '<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="Treino em andamento"><div class="row spread"><span class="eyebrow">Treino em andamento</span><button class="btn small ghost" data-action="closeSession">Sair</button></div><h2>'+safe(d.name)+'</h2><p class="sub">'+done+' de '+entries.length+' exercícios concluídos · Marque cada exercício após finalizar suas séries.</p><div class="panel"><div class="row spread"><div><span class="muted mini">Descanso opcional</span><div class="timer" id="timerLabel">'+(timerLeft?timerLeft+'s':'Pronto')+'</div></div><div class="row">'+btn('60 s','timer','small ghost','data-sec="60"')+btn('90 s','timer','small ghost','data-sec="90"')+btn('Parar','stopTimer','small ghost')+'</div></div></div>'+
entries.map(function(entry,i){var ex=get(entry.id);if(!ex)return '';
return '<div class="sessionrow '+(entry.done?'done':'')+'"><div class="row spread"><div><h4>'+safe(ex.n)+'</h4><span class="muted mini">'+safe(entry.sets)+' séries × '+safe(entry.reps)+' · Descanso: '+entry.rest+'s</span></div><label class="row mini" style="gap:5px"><input type="checkbox" class="tick" data-done="'+i+'" '+(entry.done?'checked':'')+'> Feito</label></div><div class="formgrid"><div class="field"><label>Peso (kg)</label><input type="number" min="0" max="1000" step="0.5" data-log="weight" data-entry="'+i+'" value="'+safe(entry.weight)+'" placeholder="0"></div><div class="field"><label>Reps feitas</label><input type="number" min="0" max="500" step="1" data-log="actualReps" data-entry="'+i+'" value="'+safe(entry.actualReps||'')+'" placeholder="Opcional"></div><div class="field"><label>Séries feitas</label><input type="number" min="0" max="20" step="1" data-log="actualSets" data-entry="'+i+'" value="'+safe(entry.actualSets||entry.sets)+'"></div></div></div>';
}).join('')+'<button class="btn full" data-action="finish">✓ Finalizar treino ('+done+'/'+entries.length+')</button><p class="muted mini" style="text-align:center">Só exercícios marcados como feitos entram no histórico.</p></div></div>';
}
function details(){
var x=get(modal.id);if(!x)return '';
return '<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="Detalhes do exercício"><div class="row spread"><span class="eyebrow">'+safe(x.g)+'</span><button class="btn ghost small" data-action="close">Fechar ×</button></div><div style="font-size:46px;margin:12px 0">'+x.ico+'</div><h2>'+safe(x.n)+'</h2><p class="sub">'+safe(x.tip)+'</p><div class="notice warn">Mantenha técnica adequada. Interrompa se houver dor, tontura ou desconforto incomum.</div><div style="margin-top:18px">'+btn('+ Adicionar ao treino','add','full','data-id="'+x.id+'"')+'</div></div></div>';
}
function render(){
document.getElementById('dateLabel').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'short'});
document.getElementById('main').innerHTML=tab==='home'?home():tab==='plan'?plan():tab==='library'?library():progress();
document.querySelectorAll('[data-tab]').forEach(function(el){el.classList.toggle('active',el.dataset.tab===tab);});
document.getElementById('modal').innerHTML=modal==='builder'?builder():modal==='session'?session():modal&&modal.type==='details'?details():'';
document.body.style.overflow=modal?'hidden':'';
}
function openSession(i){
if(!state.days[i])return;
if(state.active && state.active.day!==i && !confirm('Já existe outro treino iniciado. Substituir o treino em andamento?'))return;
if(!state.active||state.active.day!==i){state.active={day:i,started:Date.now(),entries:state.days[i].ex.map(function(x){return Object.assign({},x,{done:false,actualReps:'',actualSets:x.sets});})};save();}
modal='session';render();
}
function addEx(id){var e=get(id);if(!e)return;var target=state.days[selectedDay];if(!target)return;target.ex.push({id:e.id,sets:3,reps:e.g==='Cardio'?'15 min':e.g==='Core'?'30 s':'10-12',rest:e.g==='Cardio'?0:60,weight:''});save();if(modal&&modal.type==='details')modal=null;alert('Adicionado a '+target.name+'.');render();}
function finish(){
var s=state.active;if(!s)return;
var entries=s.entries.filter(function(x){return x.done;});
if(!entries.length){alert('Marque pelo menos um exercício como feito.');return;}
var volume=entries.reduce(function(sum,x){var reps=Number(x.actualReps)||parseInt(x.reps,10)||0;return sum+((Number(x.weight)||0)*(Number(x.actualSets)||Number(x.sets)||0)*reps);},0);
state.sessions.push({date:today(),name:state.days[s.day].name,done:entries.length,minutes:Math.max(1,Math.round((Date.now()-s.started)/60000)),volume:volume,exercises:entries});
delete state.active;save();modal=null;tab='progress';render();alert('Treino registrado! Boa evolução.');
}
function timerStart(sec){clearInterval(timerHandle);timerLeft=sec;updateTimer();timerHandle=setInterval(function(){timerLeft=Math.max(0,timerLeft-1);updateTimer();if(!timerLeft){clearInterval(timerHandle);if(navigator.vibrate)navigator.vibrate([140,80,140]);}},1000);}
function updateTimer(){var el=document.getElementById('timerLabel');if(el)el.textContent=timerLeft?timerLeft+'s':'Pronto';}
function download(){
var blob=new Blob([JSON.stringify({app:'TreinoLab',version:1,data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='treinolab-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
function importBackup(file){
if(!file||file.size>2e6){alert('Selecione um backup JSON de até 2 MB.');return;}
var reader=new FileReader();reader.onload=function(){try{var item=JSON.parse(reader.result),p=item.data;if(item.app!=='TreinoLab'||!p||!Array.isArray(p.days)||!Array.isArray(p.sessions)||!p.settings||p.days.length<1||p.days.length>6||p.days.some(function(x){return !x||typeof x.name!=='string'||!Array.isArray(x.ex)||x.ex.length>100||x.ex.some(function(e){return !get(e.id);});})){throw Error('Formato inválido');}
if(!confirm('Importar substitui seus treinos e histórico deste aparelho. Deseja continuar?'))return;
state={settings:p.settings,days:p.days,sessions:p.sessions.slice(0,3000),created:p.created||today()};selectedDay=0;save();tab='home';render();alert('Backup importado com sucesso.');}catch(e){alert('Arquivo de backup inválido. Não alteramos seus dados.');}};reader.readAsText(file);
}
document.addEventListener('click',function(ev){
var nav=ev.target.closest('[data-tab]');if(nav){tab=nav.dataset.tab;filter='Todos';term='';expanded=-1;render();window.scrollTo(0,0);return;}
var el=ev.target.closest('[data-action]');if(!el)return;
var a=el.dataset.action,i=Number(el.dataset.idx),id=Number(el.dataset.id);
if(a==='builder'){modal='builder';render();}
else if(a==='close'){modal=null;render();}
else if(a==='start'){openSession(i);}
else if(a==='closeSession'){modal=null;render();}
else if(a==='finish'){finish();}
else if(a==='timer'){timerStart(Number(el.dataset.sec)||60);}
else if(a==='stopTimer'){clearInterval(timerHandle);timerLeft=0;updateTimer();}
else if(a==='expand'){expanded=expanded===i?-1:i;render();}
else if(a==='remove'){if(state.days[i]&&confirm('Remover este exercício do plano?')){state.days[i].ex.splice(Number(el.dataset.ex),1);save();render();}}
else if(a==='addFromDay'){selectedDay=i;filter='Todos';term='';tab='library';render();}
else if(a==='filter'){filter=el.dataset.filter;render();}
else if(a==='add'){addEx(id);}
else if(a==='details'){modal={type:'details',id:id};render();}
else if(a==='export'){download();}
else if(a==='import'){document.getElementById('importFile').click();}
});
document.addEventListener('submit',function(ev){if(ev.target.id!=='builderForm')return;ev.preventDefault();
var goal=document.getElementById('goal').value,level=document.getElementById('level').value,days=Number(document.getElementById('days').value),equip=document.getElementById('equip').value;
if(!confirm('Substituir o plano atual? Seu histórico será mantido.'))return;
state.settings={goal:goal,level:level,days:days,equip:equip};state.days=planFor(goal,level,days,equip);delete state.active;selectedDay=0;expanded=-1;save();modal=null;tab='plan';render();});
document.addEventListener('input',function(ev){if(ev.target.id==='search'){term=ev.target.value;var r=document.getElementById('libResults');if(r)r.innerHTML=exList();}});
document.addEventListener('change',function(ev){
var el=ev.target;
if(el.id==='selectedDay'){selectedDay=Number(el.value);return;}
if(el.dataset.dayName!==undefined){var di=Number(el.dataset.dayName);if(state.days[di]){state.days[di].name=el.value.trim().slice(0,55)||'Meu treino';save();render();}return;}
if(el.dataset.edit){var d=state.days[Number(el.dataset.idx)],ex=d&&d.ex[Number(el.dataset.ex)];if(!ex)return;var prop=el.dataset.edit;if(prop==='reps')ex.reps=el.value.trim().slice(0,20)||'10-12';else ex[prop]=Math.max(prop==='sets'?1:0,Math.min(prop==='sets'?12:900,Number(el.value)||0));save();return;}
if(el.dataset.done!==undefined){var e=state.active&&state.active.entries[Number(el.dataset.done)];if(e){e.done=el.checked;save();render();}return;}
if(el.dataset.log){var entry=state.active&&state.active.entries[Number(el.dataset.entry)];if(entry){entry[el.dataset.log]=Math.max(0,Math.min(1000,Number(el.value)||0));save();}return;}
if(el.id==='importFile'){importBackup(el.files&&el.files[0]);}
});
window.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&modal){modal=null;render();}});
load();render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
})();
</script>
</body>
</html>
