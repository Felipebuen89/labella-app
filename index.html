 localStorage.setItem(KEY+'-'+activeId,JSON.stringify(state));

   used.push(x.id);
   chosen.push({id:x.id,sets:sets,reps:g==='Core'?'20-30 s':reps,rest:lip?75:p.goal==='Força'?120:75,weight:'',rir:lip?4:p.level==='Iniciante'?3:2});
  });

 });

function finish(){
var session=state.active;if(!session)return;
var entries=session.entries.filter(function(x){return x.done;});
if(!entries.length){alert('Marque pelo menos um exercício como feito.');return;}
var pain=Number(session.pain||0);
entries.forEach(function(x){x.pain=pain;});
var volume=entries.reduce(function(sum,x){var reps=Number(x.actualReps)||parseInt(x.reps,10)||0;return sum+((Number(x.weight)||0)*(Number(x.actualSets)||Number(x.sets)||0)*reps);},0);
state.sessions.push({date:today(),name:state.days[session.day].name,done:entries.length,minutes:Math.max(1,Math.round((Date.now()-session.started)/60000)),volume:volume,pain:pain,cycle:state.cycle,exercises:entries});
delete state.active;save();modal=null;tab='progress';render();
if(pain>=4)alert('Treino registrado. Como houve desconforto, evite aumentar a carga e avalie os sintomas com profissional de saúde.');else alert('Treino registrado! A carga será reavaliada com base nas próximas sessões.');
}

function importBackup(file){
if(!file||file.size>4e6){alert('Selecione um backup JSON de até 4 MB.');return;}
var reader=new FileReader();
reader.onload=function(){
 try{
  var item=JSON.parse(reader.result),p=item.data;
  if(item.app!=='TreinoLab'||!p||!Array.isArray(p.days)||!Array.isArray(p.sessions)||!p.settings||p.days.length<1||p.days.length>7)throw Error('Backup inválido');
  var personal=Array.isArray(p.customExercises)?p.customExercises:[];
  if(personal.length>100||personal.some(function(x){return !x||!Number.isSafeInteger(Number(x.id))||Number(x.id)<100000||typeof x.n!=='string'||x.n.length>75||!x.g||!x.e;}))throw Error('Exercício próprio inválido');
  var hasId=function(id){return DB.some(function(x){return x.id===Number(id);})||personal.some(function(x){return x.id===Number(id);});};
  if(p.days.some(function(d){return !d||typeof d.name!=='string'||!Array.isArray(d.ex)||d.ex.length>25||d.ex.some(function(e){return !e||!hasId(e.id)||Number(e.sets)>12||Number(e.sets)<1;});}))throw Error('Plano inválido');
  if(!confirm('Importar substitui o plano e o histórico deste perfil no aparelho. Deseja continuar?'))return;
  state=Object.assign({},p,{settings:Object.assign(defaults(),p.settings),sessions:p.sessions.slice(0,3000),customExercises:personal,cycle:Number(p.cycle)||1,created:p.created||today()});
  delete state.active;
  selectedDay=0;save();tab='home';render();alert('Backup importado com sucesso.');
 }catch(e){alert('Arquivo de backup inválido. Seus dados foram mantidos.');}
};
reader.readAsText(file);
}

else if(a==='finish'){finish();}
else if(a==='timer'){timerStart(Number(el.dataset.sec)||60);}
else if(a==='stopTimer'){clearInterval(timerHandle);timerLeft=0;updateTimer();}
else if(a==='expand'){expanded=expanded===i?-1:i;render();}
else if(a==='remove'){if(state.days[i]&&confirm('Remover este exercício do plano?')){state.days[i].ex.splice(Number(el.dataset.ex),1);save();render();}}
else if(a==='addFromDay'){selectedDay=i;filter='Todos';term='';libraryLimit=40;modalityFilter='Todos';equipmentFilter='Todos';tab='library';render();}
else if(a==='filter'){filter=el.dataset.filter;libraryLimit=40;render();}
else if(a==='add'){addEx(id);}
else if(a==='details'){modal={type:'details',id:id};render();}
else if(a==='export'){download();}
else if(a==='import'){document.getElementById('importFile').click();}
});
document.addEventListener('submit',function(ev){
if(ev.target.id==='manualForm'){
 ev.preventDefault();
 var v=function(id){return document.getElementById(id).value;};
 if(!v('manAlert')){alert('Responda se há sinais de alerta antes de continuar.');return;}
 if(v('manAlert')==='sim'){alert('Você informou sinal de alerta. Não inicie exercícios e procure atendimento médico, especialmente com falta de ar, dor no peito ou inchaço súbito de uma perna.');return;}
 if(v('manCleared')==='nao'){alert('Você informou orientação para não se exercitar. Consulte o profissional que acompanha sua saúde antes de começar.');return;}
 if(!document.getElementById('manAcknowledge').checked){alert('Confirme que compreendeu o aviso sobre orientação profissional.');return;}
 var name=v('manName').trim(),days=Number(v('manDays')),minutes=Number(v('manMinutes')),weeks=Number(v('manWeeks')),start=v('manStart');
 if(name.length<2||days<1||days>7||minutes<20||minutes>120||weeks<4||weeks>12||!/^\d{4}-\d{2}-\d{2}$/.test(start)){alert('Revise os dias, duração, nome e data do treino.');return;}
 if(days===7&&!confirm('Treinar sete dias por semana pode deixar pouco tempo para recuperação. Distribua esforço e descanso. Deseja manter os sete dias?'))return;
 if(v('manLipedema')==='true'&&Number(state.settings.pain||0)>=7){alert('Dor elevada: solicite orientação individual antes de montar exercícios.');return;}
 if(state.settings.restrictions&&!confirm('As restrições descritas no seu perfil não são interpretadas automaticamente. Valide cada exercício com um profissional. Continuar?'))return;
 makeManual({name:name,days:days,minutes:minutes,start:start,weeks:weeks,lipedema:v('manLipedema')==='true',cleared:v('manCleared')});
 return;
}
if(ev.target.id==='customExerciseForm'){
 ev.preventDefault();
 var name=document.getElementById('customName').value.trim(),group=document.getElementById('customGroup').value,
 env=document.getElementById('customEnvironment').value,mat=document.getElementById('customMaterial').value;
 var tip=document.getElementById('customTip').value.trim(),impact=document.getElementById('customImpact').value;
 if(name.length<3||name.length>75){alert('Informe um nome de 3 a 75 caracteres.');return;}
 state.customExercises=state.customExercises||[];
 if(state.customExercises.length>=100){alert('Limite de 100 exercícios próprios neste perfil.');return;}
 if(allExercises().some(function(x){return normalizeTerm(x.n)===normalizeTerm(name);})){alert('Já existe um exercício com esse nome. Use a busca.');return;}
 var id=Date.now();while(get(id))id++;
 state.customExercises.push({id:id,n:name,g:group,e:env,material:mat,ico:'✳',tip:tip||'Exercício cadastrado por você. Confirme a técnica com profissional.',impact:impact,region:group,custom:true});
 save();modal=null;term=name;filter='Todos';equipmentFilter='Todos';environmentFilter='Todos';libraryLimit=40;tab='library';render();alert('Exercício próprio salvo. Toque em + para adicioná-lo ao dia selecionado.');
 return;
}

if(ev.target.id==='newProfileForm'){
 ev.preventDefault();var name=document.getElementById('newPersonName').value.trim();
 if(name.length<2||name.length>60||registry.list.length>=8){alert('Informe nome válido. Limite de 8 perfis por aparelho.');return;}
 var id='p'+Date.now();registry.list.push({id:id,name:name});registry.active=id;activeId=id;
 state={settings:Object.assign(defaults(),{name:name}),days:[],sessions:[],created:today(),cycle:1};save();modal='builder';tab='home';render();return;
}
if(ev.target.id!=='builderForm')return;ev.preventDefault();
var v=function(id){return document.getElementById(id).value;};
var p={name:v('personName').trim(),sex:v('sex'),age:Number(v('age')),weight:Number(v('weight')),height:Number(v('height')),goal:v('goal'),level:v('level'),days:Number(v('days')),minutes:Number(v('minutes')),equip:v('equip'),lipedema:v('lipedema')==='true',pain:Number(v('pain')),cleared:v('cleared'),restrictions:v('restrictions').trim(),redFlags:v('redFlags')==='sim',start:v('start'),weeks:Number(v('weeks'))};
if(!v('redFlags')){alert('Responda à pergunta sobre sinais de alerta: selecione NÃO se nenhum estiver presente ou SIM se apresentar algum deles.');return;}
if(p.redFlags){alert('Você informou um sintoma de alerta. Não inicie o treino. Inchaço súbito em uma perna, dor no peito ou falta de ar podem exigir avaliação médica urgente.');return;}
if(p.cleared==='nao'){alert('Você informou orientação para não realizar exercícios. Procure liberação e avaliação profissional antes de gerar um plano.');return;}
if(p.lipedema&&p.pain>=7){alert('Com desconforto forte, é mais seguro solicitar orientação clínica individual antes de começar.');return;}
if(!p.name||p.name.length<2||p.age<18||p.age>100||p.weight<30||p.weight>350||p.height<120||p.height>230||p.days<2||p.days>6||p.minutes<20||p.minutes>90||p.weeks<4||p.weeks>12||!/^\d{4}-\d{2}-\d{2}$/.test(p.start)){alert('Revise os dados de avaliação e as datas.');return;}
if(p.restrictions&&p.cleared!=='sim'){alert('Você informou restrições sem confirmar orientação profissional. Solicite avaliação individual antes de gerar exercícios.');return;}
if(p.restrictions&&!confirm('Restrições escritas não são interpretadas automaticamente. Valide o treino com um profissional habilitado. Deseja continuar?'))return;
if(p.level==='Iniciante'&&p.days>3&&!confirm('Para iniciantes, costuma-se começar com 2 a 3 dias por semana. Quer manter esta frequência maior, com sessões mais leves?'))return;
if(state.days.length&&!confirm('Gerar um novo ciclo substitui o plano atual, mas preserva o histórico. Deseja continuar?'))return;
if(state.days.length){state.cycles=state.cycles||[];state.cycles.push({cycle:state.cycle||1,start:state.settings.start,end:endDate(),days:state.days,settings:state.settings});state.cycles=state.cycles.slice(-12);}
state.cycle=(state.days.length?Number(state.cycle||1)+1:1);
state.settings=Object.assign({},p,{mode:'automatico'});
state.days=planFor(p);
delete state.active;
var profile=registry.list.find(function(x){return x.id===activeId;});if(profile)profile.name=p.name;
selectedDay=0;expanded=-1;save();modal=null;tab='plan';render();
});
document.addEventListener('input',function(ev){if(ev.target.id==='search'){term=ev.target.value;libraryLimit=40;var r=document.getElementById('libResults');if(r)r.innerHTML=exList();}});
document.addEventListener('change',function(ev){
var el=ev.target;
if(el.id==='selectedDay'){selectedDay=Number(el.value);render();return;}
if(el.id==='muscleFilter'){filter=el.value;libraryLimit=40;render();return;}
if(el.id==='modalityFilter'){modalityFilter=el.value;equipmentFilter='Todos';libraryLimit=40;render();return;}
if(el.id==='equipmentFilter'){equipmentFilter=el.value;libraryLimit=40;render();return;}
if(el.id==='environmentFilter'){environmentFilter=el.value;libraryLimit=40;render();return;}
if(el.id==='sessionPain'){if(state.active){state.active.pain=Number(el.value);save();}return;}
if(el.dataset.dayName!==undefined){var di=Number(el.dataset.dayName);if(state.days[di]){state.days[di].name=el.value.trim().slice(0,55)||'Meu treino';save();render();}return;}
if(el.dataset.edit){var d=state.days[Number(el.dataset.idx)],ex=d&&d.ex[Number(el.dataset.ex)];if(!ex)return;var prop=el.dataset.edit;if(prop==='reps')ex.reps=el.value.trim().slice(0,20)||'10-12';else ex[prop]=Math.max(prop==='sets'?1:0,Math.min(prop==='sets'?12:900,Number(el.value)||0));save();return;}
if(el.dataset.done!==undefined){var e=state.active&&state.active.entries[Number(el.dataset.done)];if(e){e.done=el.checked;save();render();}return;}
if(el.dataset.log){var entry=state.active&&state.active.entries[Number(el.dataset.entry)];if(entry){entry[el.dataset.log]=el.dataset.log==='actualRir'?el.value:Math.max(0,Math.min(1000,Number(el.value)||0));save();}return;}
if(el.id==='importFile'){importBackup(el.files&&el.files[0]);}
});
