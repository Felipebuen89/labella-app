name: Atualizar icones do La'Bella
on:
  push:
    branches: [main]
    paths:
      - assets/logo_labella.webp
      - .github/workflows/gerar-icones.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Gerar PNGs quadrados a partir da logo existente
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          im = Image.open("assets/logo_labella.webp").convert("RGBA")
          bbox = im.getbbox()
          if bbox:
              im = im.crop(bbox)
          for size, filename in [(180, "apple-touch-icon.png"), (192, "icon-192.png"), (512, "icon-512.png")]:
              canvas = Image.new("RGBA", (size, size), "#171110")
              inner = int(size * 0.87)
              layer = im.copy()
              layer.thumbnail((inner, inner), Image.Resampling.LANCZOS)
              x, y = (size-layer.width)//2, (size-layer.height)//2
              canvas.alpha_composite(layer, (x, y))
              canvas.convert("RGB").save(filename, format="PNG", optimize=True)
              print(filename, Path(filename).stat().st_size)
          PY
      - name: Publicar icones no repositorio
        shell: bash
        run: |
          git add apple-touch-icon.png icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Gerar icones PNG da marca LaBella"
            git push
          fi
