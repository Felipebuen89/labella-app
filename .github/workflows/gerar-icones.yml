name: Gerar ícones do TreinoLab
on:
  push:
    branches: [main]
    paths:
      - icon.svg
      - .github/workflows/gerar-icones.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Desenhar ícones para instalação em celular
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          for sz, path in [(180,'apple-touch-icon.png'),(192,'icon-192.png'),(512,'icon-512.png')]:
              scale=3
              n=sz*scale
              img=Image.new('RGB',(n,n),'#101311')
              draw=ImageDraw.Draw(img)
              def box(xy,rad,fill,outline=None,width=1):
                  draw.rounded_rectangle(tuple(round(t*n/512) for t in xy),radius=round(rad*n/512),fill=fill,outline=outline,width=max(1,round(width*n/512)))
              box((24,24,488,488),100,'#202b20','#bde766',6)
              box((123,232,389,280),24,'#c4f26b')
              box((105,182,155,330),15,'#c4f26b')
              box((62,205,96,307),12,'#c4f26b')
              box((357,182,407,330),15,'#c4f26b')
              box((416,205,450,307),12,'#c4f26b')
              img.resize((sz,sz),Image.Resampling.LANCZOS).save(path,optimize=True)
              print(path,Path(path).stat().st_size)
          PY
      - name: Publicar ícones
        shell: bash
        run: |
          git add apple-touch-icon.png icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Atualizar ícones do TreinoLab"
            git push
          fi
