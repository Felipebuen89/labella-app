name: Márcia Calixto Android — teste interno (APK)
on:
  workflow_dispatch:
  # Executa também nesta atualização controlada da configuração de CI.
  push:
    paths:
      - '.github/workflows/marcia-android-preview.yml'

permissions:
  contents: read

jobs:
  android-preview:
    name: Compilar APK debug da demonstração
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar plataforma 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Instalar dependências Capacitor 8
        working-directory: marcia-android
        run: npm install --no-audit --no-fund
      - name: Preparar web e gerar projeto Android
        working-directory: marcia-android
        run: |
          npm run build:web
          npx cap add android
          npm run android:check
      - name: Compilar APK debug — não assinado para Play Store
        working-directory: marcia-android/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Disponibilizar artefato para teste interno
        uses: actions/upload-artifact@v4
        with:
          name: marcia-calixto-demo-debug-apk
          path: marcia-android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
