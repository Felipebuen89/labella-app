name: Márcia Calixto Android — teste interno (APK)
on:
  workflow_dispatch:
  # Executa também nesta atualização controlada da configuração de CI.
  push:
    paths:
      - '.github/workflows/marcia-android-preview.yml'

permissions:
  contents: write

jobs:
  android-preview:
    name: Compilar APK debug da demonstração
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Preparar Android SDK 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -n "$SDKMANAGER"
          echo "SDK manager selecionado: $SDKMANAGER"
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-|build-tools;' || true
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Instalar dependências Capacitor 8
        working-directory: marcia-android
        run: npm install --no-audit --no-fund
      - name: Preparar web e gerar projeto Android
        working-directory: marcia-android
        run: |
          npm run build:web
          npx cap add android
          npm run android:check
      - name: Compilar APK debug — não assinado para Play Store
        working-directory: marcia-android/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Disponibilizar artefato para teste interno
        uses: actions/upload-artifact@v4
        with:
          name: marcia-calixto-demo-debug-apk
          path: marcia-android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Criar link público do APK de demonstração
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp marcia-android/android/app/build/outputs/apk/debug/app-debug.apk marcia-calixto-demo-android.apk
          TAG="mc-demo-android-v1"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --latest=false \
              --title "Move Digital · Márcia Calixto · DEMO NÃO OFICIAL" \
              --notes "APK apenas para testes internos no Android. Não é o app oficial da clínica, não foi publicado na Google Play e usa dados fictícios. Não cadastrar dados pessoais reais. Instalação externa à loja é por conta e risco do testador."
          fi
          gh release upload "$TAG" marcia-calixto-demo-android.apk --clobber
          echo "Link de teste: https://github.com/${{ github.repository }}/releases/download/$TAG/marcia-calixto-demo-android.apk"
