name: Auditoria técnica do Web Push
on:
  push:
    paths:
      - 'push-demo/**'
      - 'painel.html'
      - 'notificacoes.html'
      - 'config.js'
      - 'index.html'
      - 'proprietario.html'
      - 'backend.js'
      - 'acesso.html'
      - 'demo-proprietario.html'
      - 'demo-proprietario-v2.js'
      - 'demo-proprietario-v2.css'
      - 'auth-config.js'
      - 'auth-core.js'
      - 'minha-conta.html'
      - 'manifest.webmanifest'
      - '.github/workflows/auditoria-webpush.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar ambiente de navegador simulado
        run: npm install --no-save --prefix push-demo jsdom
      - name: Teste funcional seguro e isolado (sem notificação real)
        run: node --test push-demo/audit.test.cjs push-demo/database.test.cjs push-demo/panel.test.cjs push-demo/optin.test.cjs push-demo/browser-access.test.cjs push-demo/roles.test.cjs push-demo/auth-roles.test.cjs push-demo/demo-owner.test.cjs push-demo/demo-v2.test.cjs
