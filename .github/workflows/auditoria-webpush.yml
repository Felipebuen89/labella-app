name: Auditoria técnica do Web Push
on:
  push:
    paths:
      - 'push-demo/**'
      - 'painel.html'
      - 'notificacoes.html'
      - '.github/workflows/auditoria-webpush.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Teste funcional seguro e isolado (sem notificação real)
        run: node --test push-demo/audit.test.cjs push-demo/database.test.cjs
